<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D2130">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cosa mi aiuta">
<meta name="format-detection" content="telephone=no">
<title>Cosa mi aiuta · osservazione cooperativa del contesto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* =========================================================
   COSA MI AIUTA — foglio di stile (fondamenta dalla 0.1, stile tipografico dalla 0.8)
   Gruppo Nazionale Inclusione MCE
   ========================================================= */
:root{
  --carta:#F3ECDD;
  --foglio:#FFFCF4;
  --quadretto:#E4D9C2;
  --inchiostro:#1D2130;
  --grafite:#3B3F4E;
  --tenue:#585B66;
  --bordo:#C9B993;
  --lavagna:#2C5D4C;
  --lavagna-scura:#1F4538;
  --lavagna-chiara:#E6EDE3;
  --evidenziatore:#F4CD3E;
  --rosso:#A8281D;
  --pericolo:#9E3524;
  --pericolo-chiaro:#FBEAE6;
  --focus:#1F5FD1;
  --ombra:none;
  --scala:1;
  --interlinea:1.55;
  --spazio-lettere:0;
  color-scheme:light;
}
:root[data-tema-attivo="scuro"]{
  --carta:#16140F;
  --foglio:#1F1C15;
  --quadretto:#2B271E;
  --inchiostro:#EFE7D6;
  --grafite:#D5CCBA;
  --tenue:#B5AC99;
  --bordo:#51493A;
  --lavagna:#72C29E;
  --lavagna-scura:#93D5B6;
  --lavagna-chiara:#1E3128;
  --evidenziatore:#8F7514;
  --rosso:#F2907C;
  --pericolo:#F08C78;
  --pericolo-chiaro:#3A211C;
  --focus:#8AB4FF;
  --ombra:none;
  color-scheme:dark;
}
:root[data-contrasto="alto"]{
  --carta:#FFFFFF; --foglio:#FFFFFF; --quadretto:transparent;
  --inchiostro:#000; --grafite:#000; --tenue:#000; --bordo:#000;
  --lavagna:#0A4A33; --lavagna-scura:#000; --lavagna-chiara:#FFFFFF;
  --evidenziatore:#FFE000; --pericolo:#8A1C0C; --rosso:#8A1C0C; --pericolo-chiaro:#fff; --focus:#0033CC;
}
:root[data-contrasto="alto"][data-tema-attivo="scuro"]{
  --carta:#000; --foglio:#000; --quadretto:transparent;
  --inchiostro:#fff; --grafite:#fff; --tenue:#fff; --bordo:#fff;
  --lavagna:#7CF0BE; --lavagna-scura:#fff; --lavagna-chiara:#000;
  --evidenziatore:#7A6500; --pericolo:#FF9A85; --rosso:#FF9A85; --pericolo-chiaro:#000; --focus:#FFD400;
}
:root[data-spazio="ampio"]{ --interlinea:1.85; --spazio-lettere:.03em; }

*,*::before,*::after{box-sizing:border-box}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ font-size:calc(100% * var(--scala)); scroll-padding-top:env(safe-area-inset-top,0px); }
body{
  margin:0; min-height:100vh;
  font-family:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  line-height:var(--interlinea); letter-spacing:var(--spazio-lettere);
  color:var(--inchiostro); background-color:var(--carta);
  background-image:radial-gradient(var(--quadretto) 1.1px, transparent 1.3px); /* carta puntinata */
  background-size:1.25rem 1.25rem;
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }

a{color:var(--lavagna-scura)}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px; border-radius:3px}
h1[tabindex="-1"]:focus{outline:none}
.salta{position:absolute; left:-999px; top:.5rem; background:var(--foglio); padding:.5rem 1rem; z-index:10}
.salta:focus{left:.5rem}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* ---------- testata ---------- */
.testata{
  background:var(--foglio); border-bottom:2px solid var(--inchiostro);
  padding:.75rem 1.25rem;
}
.testata-dentro{max-width:62rem; margin:0 auto; display:flex; align-items:center; gap:1rem; flex-wrap:wrap}
.marchio{display:flex; align-items:baseline; gap:.75rem; min-height:44px; padding-top:.35rem; text-decoration:none; color:var(--inchiostro); margin-right:auto}
.marchio b{font-size:1.35rem; letter-spacing:-.01em}
.marchio span{color:var(--tenue); font-size:.9rem}
.testata nav{display:flex; gap:.25rem}
.testata nav a{padding:.4rem .7rem; min-height:44px; display:inline-flex; align-items:center; border-radius:6px; text-decoration:none; color:var(--inchiostro)}
.testata nav a:hover{background:var(--carta)}

.avviso{max-width:62rem; margin:1rem auto 0; padding:.75rem 1rem; border:2px solid var(--pericolo); background:var(--pericolo-chiaro); color:var(--inchiostro); border-radius:8px}

main{max-width:62rem; margin:0 auto; padding:1.5rem 1.25rem 4rem}
main:focus{outline:none}

/* ---------- tipografia ---------- */
h1,h2,h3{line-height:1.2; margin:0 0 .5rem}
h1{font-size:2rem; letter-spacing:-.015em}
h2{font-size:1.4rem; margin-top:2rem}
h3{font-size:1.1rem; margin-top:1.25rem}
p{margin:.25rem 0 .75rem; max-width:68ch}
.nota{color:var(--tenue); font-size:.95rem}
.piccolo{font-size:.9rem}

/* ---------- foglio (pannello principale) ---------- */
.foglio{
  background:var(--foglio); border:1px solid var(--bordo); border-radius:10px;
  padding:1.25rem 1.5rem; box-shadow:var(--ombra); margin:1rem 0;
}
.foglio > :first-child{margin-top:0}

/* ---------- pulsanti ---------- */
button,.bottone{
  font:inherit; letter-spacing:inherit; cursor:pointer;
  display:inline-flex; align-items:center; gap:.4rem; min-height:2.75rem;
  padding:.55rem 1.1rem; border-radius:6px; text-decoration:none;
  border:2px solid var(--lavagna); background:var(--lavagna); color:#fff; font-weight:700;
}
:root[data-tema-attivo="scuro"] button:not(.secondario):not(.pericolo):not(.testuale),
:root[data-tema-attivo="scuro"] .bottone:not(.secondario){color:#0E1A15}
button:hover,.bottone:hover{background:var(--lavagna-scura); border-color:var(--lavagna-scura)}
button.secondario,.bottone.secondario{background:transparent; color:var(--lavagna-scura); border-color:var(--lavagna)}
button.secondario:hover,.bottone.secondario:hover{background:var(--lavagna-chiara)}
button.pericolo{background:transparent; color:var(--pericolo); border-color:var(--pericolo)}
button.pericolo:hover{background:var(--pericolo-chiaro)}
button.testuale{background:none; border:none; color:var(--lavagna-scura); padding:.5rem .4rem; min-height:44px; text-decoration:underline; font-weight:400}
button:disabled{opacity:.5; cursor:not-allowed}
.azioni{display:flex; gap:.75rem; flex-wrap:wrap; align-items:center; margin-top:1.25rem}

/* ---------- moduli ---------- */
.campo{margin:0 0 1rem}
.campo > label, .campo > .etichetta{display:block; font-weight:700; margin-bottom:.3rem}
.campo .aiuto{display:block; color:var(--tenue); font-size:.9rem; margin:-.15rem 0 .35rem; max-width:62ch}
input[type=text],input[type=number],input[type=password],input[type=datetime-local],input[type=search],select,textarea{
  font:inherit; font-size:max(16px, 1rem); letter-spacing:inherit; color:var(--inchiostro); background:var(--foglio);
  border:2px solid var(--bordo); border-radius:6px; padding:.55rem .7rem; width:100%; max-width:32rem; min-height:2.75rem;
}
textarea{min-height:5rem; max-width:40rem}
input:focus,select:focus,textarea:focus{border-color:var(--focus); outline:none; box-shadow:0 0 0 2px var(--focus)}
.griglia-campi{display:grid; grid-template-columns:repeat(auto-fit,minmax(14rem,1fr)); gap:0 1.25rem}
.griglia-campi .campo input,.griglia-campi .campo select{max-width:none}
fieldset{border:none; padding:0; margin:0 0 1rem}
legend{font-weight:700; margin-bottom:.4rem; padding:0}
.scelte{display:flex; gap:.5rem; flex-wrap:wrap}
.scelta{position:relative}
.scelta input{position:absolute; opacity:0; inset:0; cursor:pointer}
.scelta > span{display:inline-block; padding:.5rem .9rem; border:2px solid var(--bordo); border-radius:999px; background:var(--foglio)}
.scelta input:checked + span{border-color:var(--lavagna); background:var(--lavagna-chiara); font-weight:700}
.scelta input:focus-visible + span{outline:3px solid var(--focus); outline-offset:2px}
.errore{color:var(--pericolo); font-weight:700}
.attenzione{border-left:4px solid var(--evidenziatore); background:var(--carta); padding:.5rem .75rem; margin:.5rem 0; max-width:62ch}

/* ---------- elenco fascicoli (quaderni) ---------- */
.quaderni{list-style:none; padding:0; margin:1rem 0; display:grid; grid-template-columns:repeat(auto-fill,minmax(17rem,1fr)); gap:1rem}
.quaderno{
  position:relative; background:var(--foglio); border:1px solid var(--bordo); border-radius:4px 10px 10px 4px;
  padding:1rem 1.1rem 1rem 1.6rem; box-shadow:var(--ombra);
}
.quaderno::before{content:""; position:absolute; left:0; top:0; bottom:0; width:.55rem; background:var(--lavagna); border-radius:4px 0 0 4px}
.quaderno h2{margin:0 0 .25rem; font-size:1.3rem}
.quaderno h2 a{color:var(--inchiostro); text-decoration:none}
.quaderno h2 a::after{content:""; position:absolute; inset:0}
.quaderno h2 a:focus-visible{outline:none}
.quaderno:focus-within{outline:3px solid var(--focus); outline-offset:2px}
.quaderno dl{display:grid; grid-template-columns:auto 1fr; gap:.1rem .75rem; margin:.5rem 0 0; font-size:.95rem}
.quaderno dt{color:var(--tenue)}
.quaderno dd{margin:0}
.quaderno .azioni-quaderno{position:relative; z-index:1; margin:.5rem 0 0; display:flex; justify-content:flex-end}
.quaderno .elimina-quaderno{color:var(--pericolo); padding:.5rem .6rem}
.segno{display:inline-block; font-size:.85rem; padding:.05rem .5rem; border-radius:4px; background:var(--lavagna-chiara); color:var(--lavagna-scura); font-weight:700; border:1px solid var(--lavagna)}

/* ---------- procedura guidata ---------- */
.passi{list-style:none; display:flex; gap:.5rem; padding:0; margin:1rem 0 0; flex-wrap:wrap; counter-reset:passo}
.passi li{counter-increment:passo; display:flex; align-items:center; gap:.5rem; color:var(--tenue); padding:.3rem .75rem .3rem .3rem; border-radius:999px; border:1px solid var(--bordo); background:var(--foglio)}
.passi li::before{content:counter(passo); display:inline-grid; place-items:center; width:1.8rem; height:1.8rem; border-radius:50%; border:2px solid var(--bordo); font-weight:700}
.passi li[aria-current="step"]{color:var(--inchiostro); font-weight:700; border-color:var(--lavagna)}
.passi li[aria-current="step"]::before{background:var(--lavagna); border-color:var(--lavagna); color:#fff}
.passi li.fatto::before{content:"✓"; border-color:var(--lavagna); color:var(--lavagna-scura)}

/* ---------- attività ---------- */
.dimensione{margin-top:1.5rem}
.dimensione > h3{padding-bottom:.3rem; border-bottom:2px solid var(--inchiostro); margin-bottom:.5rem}
.attivita-lista{list-style:none; padding:0; margin:0}
.attivita-lista > li{display:flex; gap:.75rem; align-items:flex-start; padding:.65rem 0; border-bottom:1px dashed var(--bordo)}
.attivita-lista > li:last-child{border-bottom:none}
.attivita-lista input[type=checkbox]{width:1.6rem; height:1.6rem; margin-top:.2rem; accent-color:var(--lavagna); flex:none}
.attivita-corpo{flex:1}
.attivita-corpo label,.attivita-corpo strong{font-weight:700; cursor:pointer}
.codice{font-size:.85rem; color:var(--tenue); margin-left:.4rem; font-weight:400}
.attivita-corpo p{margin:.15rem 0 0; font-size:.95rem; color:var(--grafite)}
.contatore{position:sticky; bottom:0; background:var(--foglio); border-top:2px solid var(--inchiostro); padding:.75rem 0; margin-top:1rem; display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap}

/* ---------- fascicolo ---------- */
.intestazione-fascicolo{margin-top:.5rem}
.intestazione-fascicolo .meta{color:var(--tenue); margin:0}
.nome-locale{display:inline-block; margin-left:.5rem; font-size:1rem; font-weight:400; color:var(--grafite)}
.schede{display:flex; gap:.25rem; border-bottom:2px solid var(--inchiostro); margin:1.25rem 0 0; overflow-x:auto; padding:0}
.schede a{padding:.6rem 1rem; text-decoration:none; color:var(--inchiostro); white-space:nowrap; border-radius:6px 6px 0 0}
.schede a:hover{background:var(--foglio)}
.schede .fase-impostare{margin-left:auto}
.sottoschede{display:flex; gap:.5rem; flex-wrap:wrap; margin:.75rem 0 0}
.sottoschede a{padding:.35rem .9rem; border:1px solid var(--bordo); border-radius:999px; text-decoration:none; color:var(--inchiostro); background:var(--foglio); min-height:2.5rem; display:inline-flex; align-items:center}
.sottoschede a[aria-current="page"]{border:2px solid var(--lavagna); background:var(--lavagna-chiara); font-weight:700}
.ciclo{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1rem; margin:1.25rem 0}
@media (max-width:40rem){ .ciclo{grid-template-columns:1fr} }
.fase{background:var(--foglio); border:1px solid var(--bordo); border-top:5px solid var(--lavagna); border-radius:8px; padding:1rem 1.1rem; display:flex; flex-direction:column}
.fase h2{margin:0 0 .35rem; font-size:1.2rem}
.fase p{margin:.2rem 0 .5rem}
.fase ul{margin:.25rem 0 .75rem; padding-left:1.1rem}
.fase .azioni{margin-top:auto; padding-top:.5rem}
.fase.in-attesa{border-top-color:var(--bordo)}
.schede{flex-wrap:wrap; overflow-x:visible}
@media (max-width:52rem){ .schede .fase-impostare{margin-left:0} }
.testo-breve{display:none}
a, button, label, summary, input, select, textarea{touch-action:manipulation}
dialog:not([open]){display:none}
dialog.dialogo-sostituto[open]{position:fixed; inset:0; margin:auto; height:fit-content; max-height:calc(100% - 2rem); overflow:auto; z-index:50; box-shadow:0 0 0 100vmax rgba(10,16,28,.55)}
@media (max-width:40rem){
  main{padding:1rem 1rem 4rem}
  .testata{padding:.4rem 1rem}
  .foglio{padding:1rem}
  details.leva-form .corpo-leva{padding-left:0}
  .blocco-alunno{padding:.25rem .75rem .75rem}
  dialog{padding:1.1rem}
  .barra-salva{position:sticky; bottom:0; z-index:5; background:var(--foglio); margin:1rem -1rem -1rem; padding:.75rem 1rem calc(.75rem + env(safe-area-inset-bottom,0px)); border-radius:0 0 10px 10px}
  .barra-salva{gap:.5rem}
  .barra-salva > *{flex:1 1 auto; justify-content:center; text-align:center; padding-left:.4rem; padding-right:.4rem; white-space:nowrap; min-height:2.75rem}
  .barra-salva > button[type=submit]{flex-basis:100%}
  .testo-lungo{display:none}
  .testo-breve{display:inline}
  body .toast{bottom:auto; top:calc(.75rem + env(safe-area-inset-top,0px)); width:max-content}
}
.schede a[aria-current="page"]{
  font-weight:700;
  background-image:linear-gradient(transparent 58%, var(--evidenziatore) 58%, var(--evidenziatore) 88%, transparent 88%);
  background-color:var(--foglio);
}
.riassunto{display:grid; grid-template-columns:repeat(auto-fit,minmax(11rem,1fr)); gap:1rem; margin:1rem 0}
.riassunto div{background:var(--foglio); border:1px solid var(--bordo); border-radius:8px; padding:.8rem 1rem}
.riassunto b{display:block; font-size:1.6rem; line-height:1.1}
.riassunto span{color:var(--tenue); font-size:.95rem}

table{border-collapse:collapse; width:100%}
.tabella-scorri{overflow-x:auto; position:relative} /* tiene dentro anche le etichette per i lettori di schermo */
th,td{text-align:left; padding:.55rem .6rem; border-bottom:1px solid var(--bordo); vertical-align:top}
th{border-bottom:2px solid var(--inchiostro)}

.leve{display:grid; grid-template-columns:repeat(auto-fit,minmax(17rem,1fr)); gap:1rem}
.leva{border:1px solid var(--bordo); border-radius:8px; padding:.8rem 1rem; background:var(--foglio)}
.leva h3{margin:0 0 .25rem}
.leva ul{margin:.25rem 0 0; padding-left:1.1rem}
.leva li{margin:.15rem 0}

.diario{list-style:none; padding:0; margin:1rem 0; border-left:3px solid var(--inchiostro)}
.diario li{position:relative; padding:.4rem 0 .9rem 1.25rem}
.diario li::before{content:""; position:absolute; left:-.5rem; top:.85rem; width:.75rem; height:.75rem; border-radius:50%; background:var(--foglio); border:3px solid var(--lavagna)}
.diario time{display:block; color:var(--tenue); font-size:.9rem}
.sigla{display:inline-block; min-width:2.2rem; text-align:center; font-weight:700; font-size:.85rem; padding:.05rem .35rem; border:2px solid var(--inchiostro); border-radius:4px; margin-right:.4rem}

details.gestione{margin-top:2.5rem; border-top:1px solid var(--bordo); padding-top:1rem}
details.gestione summary{cursor:pointer; font-weight:700}

.vuoto{border:2px dashed var(--bordo); border-radius:10px; padding:1.5rem; background:var(--foglio); text-align:left}

/* ---------- dialogo e toast ---------- */
dialog{border:2px solid var(--inchiostro); border-radius:10px; padding:1.5rem; max-width:34rem; width:calc(100% - 2rem); background:var(--foglio); color:var(--inchiostro)}
dialog::backdrop{background:rgba(10,16,28,.55)}
.toast{position:fixed; left:50%; bottom:calc(1.25rem + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--inchiostro); color:var(--foglio); padding:.7rem 1.1rem; border-radius:8px; max-width:calc(100% - 2rem); z-index:20}

/* ---------- esiti ---------- */
:root{ --ocra:#7A4F00; --ocra-chiaro:#FFF3D6; --mattone:#9E3524; --mattone-chiaro:#FBEAE6; }
:root[data-tema-attivo="scuro"]{ --ocra:#F2B84B; --ocra-chiaro:#3A2E12; --mattone:#F08C78; --mattone-chiaro:#3A211C; }
:root[data-contrasto="alto"]{ --ocra:#5A3A00; --ocra-chiaro:#fff; --mattone:#8A1C0C; --mattone-chiaro:#fff; }
:root[data-contrasto="alto"][data-tema-attivo="scuro"]{ --ocra:#FFD27A; --ocra-chiaro:#000; --mattone:#FF9A85; --mattone-chiaro:#000; }
.esito{display:inline-flex; align-items:center; gap:.35rem; font-weight:700; font-size:.9rem; padding:.1rem .55rem; border-radius:4px; border:2px solid; white-space:nowrap}
.esito.funziona{color:var(--lavagna-scura); border-color:var(--lavagna); background:var(--lavagna-chiara)}
.esito.in_parte{color:var(--ocra); border-color:var(--ocra); background:var(--ocra-chiaro)}
.esito.non_funziona{color:var(--mattone); border-color:var(--mattone); background:var(--mattone-chiaro)}
.scelta input[value="funziona"]:checked + span{border-color:var(--lavagna); background:var(--lavagna-chiara); color:var(--lavagna-scura)}
.scelta input[value="in_parte"]:checked + span{border-color:var(--ocra); background:var(--ocra-chiaro); color:var(--ocra)}
.scelta input[value="non_funziona"]:checked + span{border-color:var(--mattone); background:var(--mattone-chiaro); color:var(--mattone)}

/* ---------- scheda episodio ---------- */
.leva-form{border-top:1px solid var(--bordo); padding-top:.75rem; margin:0 0 .75rem}
.leva-form > legend{font-size:1.1rem; float:left; width:100%; margin-bottom:.4rem}
.leva-form > legend + *{clear:both}
.leva-form .nota-icf{font-weight:400; font-size:.85rem; color:var(--tenue); margin-left:.4rem}
.sottocampo{margin:0 0 .7rem}
.sottocampo .aiuto{display:block; color:var(--tenue); font-size:.9rem; margin:0 0 .3rem; max-width:62ch}
.sottocampo .etichetta,.sottocampo label{display:block; font-size:.95rem; font-weight:700; margin-bottom:.25rem}
.scelte.compatte{gap:.4rem}
.scelte.compatte .scelta > span{padding:.35rem .75rem}
.scelta input[type=checkbox] + span::before{content:"+ "; color:var(--tenue)}
.scelta input[type=checkbox]:checked + span::before{content:"✓ "; color:inherit}
.sguardo{max-width:44rem}
.sguardo:empty{display:none}
.sguardo-testa{display:flex; flex-wrap:wrap; gap:.25rem .75rem; align-items:baseline; margin:.6rem 0 .3rem; font-size:.95rem}
.sguardo-testa b{font-size:1rem}
.sguardo-voce{border:1px solid var(--bordo); border-left:5px solid var(--bordo); border-radius:6px 10px 10px 6px; background:var(--foglio); padding:.6rem .9rem; margin:.45rem 0}
.sguardo-voce.forte{border-left-color:var(--mattone)}
.sguardo-voce.medio{border-left-color:var(--ocra)}
.sguardo-voce.nota{border-left-color:var(--bordo)}
.sguardo-voce p{margin:.2rem 0; font-size:.95rem}
.sguardo-cat{display:flex; flex-wrap:wrap; gap:.2rem .6rem; align-items:baseline}
.sguardo-livello{font-weight:700; font-size:.85rem; padding:0 .45rem; border-radius:4px; border:2px solid}
.forte .sguardo-livello{color:var(--mattone); border-color:var(--mattone); background:var(--mattone-chiaro)}
.medio .sguardo-livello{color:var(--ocra); border-color:var(--ocra); background:var(--ocra-chiaro)}
.nota .sguardo-livello{color:var(--tenue); border-color:var(--bordo)}
.sguardo-frase{margin:.35rem 0; padding:.3rem .6rem; border-left:3px solid var(--bordo); color:var(--inchiostro); font-style:italic}
.sguardo-domanda{font-weight:700}
.sguardo-voce details{margin:.25rem 0; font-size:.95rem}
.sguardo-voce details summary{cursor:pointer; color:var(--lavagna-scura); min-height:32px}
.sguardo-azioni{display:flex; flex-wrap:wrap; gap:.25rem .75rem; align-items:center; margin-top:.35rem}
.sguardo-azioni button{min-height:2.5rem; padding:.35rem .8rem; font-size:.95rem}
.sguardo-motivi{display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.4rem}
.sguardo-motivi[hidden], .sguardo:empty{display:none}
.sguardo-motivi button{font-weight:400}
.sguardo-tenuta{font-size:.9rem; color:var(--tenue); margin:.25rem 0}
.sguardo-struttura{border:1px dashed var(--ocra); background:var(--ocra-chiaro); color:var(--inchiostro); border-radius:8px; padding:.55rem .85rem; margin:.45rem 0; font-size:.95rem}
.sguardo-struttura.nota{border-color:var(--bordo); background:var(--carta)}
.tre-domande{margin:.3rem 0 .45rem; padding-left:1.2rem; color:var(--grafite); font-size:.92rem}
.tre-domande li{margin:.1rem 0}
.sguardo-pulito{font-size:.9rem; color:var(--lavagna-scura); margin:.4rem 0}
.livelli-sguardo{list-style:none; padding:0; margin:.5rem 0}
.livelli-sguardo li{margin:.4rem 0; display:flex; flex-wrap:wrap; gap:.2rem .6rem; align-items:baseline}
.categoria-sguardo{border:1px solid var(--bordo); border-left:5px solid var(--bordo); border-radius:6px 10px 10px 6px; padding:.45rem .85rem; margin:.45rem 0; background:var(--foglio)}
.categoria-sguardo.forte{border-left-color:var(--mattone)}
.categoria-sguardo.medio{border-left-color:var(--ocra)}
.categoria-sguardo summary{cursor:pointer; font-weight:700; min-height:2.25rem; display:flex; flex-wrap:wrap; gap:.2rem .6rem; align-items:center}
.categoria-sguardo p{margin:.35rem 0; max-width:62ch}
.lista-personali{list-style:none; padding:0; margin:.5rem 0 1rem}
.lista-personali li{display:flex; justify-content:space-between; gap:.75rem; align-items:center; border-bottom:1px solid var(--bordo); padding:.4rem 0}
.palestra-esito{color:var(--lavagna-scura); font-weight:700; max-width:62ch}
.palestra-esito:empty{display:none}
.tabella-parole th, .tabella-parole td{text-align:left; vertical-align:top; padding:.45rem .5rem; border-bottom:1px solid var(--bordo)}
.tabella-parole tbody th{font-weight:400}
.tabella-parole .sguardo-livello{margin-right:.35rem}
.lista-miei li{margin:.35rem 0}
mark{background:var(--evidenziatore); color:inherit; padding:0 .15em; border-radius:2px}
.barra-salva{display:flex; gap:.75rem; flex-wrap:wrap; align-items:center; margin-top:1.25rem; padding-top:1rem; border-top:2px solid var(--inchiostro)}

/* ---------- leve richiudibili e blocco alunno ---------- */
details.leva-form{border-top:1px solid var(--bordo); padding:.5rem 0 .25rem; margin:0}
details.leva-form > summary{cursor:pointer; list-style:none; display:flex; flex-wrap:wrap; align-items:baseline; gap:.2rem .6rem; padding:.35rem 0; min-height:2.75rem}
details.leva-form > summary::-webkit-details-marker{display:none}
details.leva-form > summary::before{content:"▸"; display:inline-block; width:1rem; color:var(--tenue); transition:transform .15s}
details.leva-form[open] > summary::before{transform:rotate(90deg)}
details.leva-form > summary b{font-size:1.08rem}
details.leva-form .riepilogo-leva{font-size:.9rem; color:var(--lavagna-scura); font-weight:700}
details.leva-form .corpo-leva{padding:.4rem 0 .5rem 1rem}
.blocco-alunno{border:2px dashed var(--bordo); border-radius:10px; padding:.25rem 1rem .75rem; margin:1.25rem 0}
.blocco-alunno > summary{cursor:pointer; font-weight:700; font-size:1.15rem; padding:.6rem 0; min-height:2.75rem}
.blocco-alunno .spiega{max-width:62ch}
.contesto li.segnale{border-color:var(--mattone); color:var(--mattone)}
.contesto li.calma{border-color:var(--lavagna); color:var(--lavagna-scura)}

/* ---------- diario ---------- */
.intestazione-fascicolo{display:flex; justify-content:space-between; align-items:flex-end; gap:1rem; flex-wrap:wrap}
.filtri{display:grid; grid-template-columns:repeat(auto-fit,minmax(11rem,1fr)); gap:.75rem 1rem; align-items:end}
.filtri .campo{margin:0}
.filtri select{max-width:none}
.giorno{font-size:1.05rem; margin:1.75rem 0 .25rem; padding-bottom:.25rem; border-bottom:1px solid var(--bordo)}
.episodio{background:var(--foglio); border:1px solid var(--bordo); border-left:6px solid var(--bordo); border-radius:6px 10px 10px 6px; padding:.9rem 1.1rem; margin:.75rem 0}
.episodio.funziona{border-left-color:var(--lavagna)}
.episodio.in_parte{border-left-color:var(--ocra)}
.episodio.non_funziona{border-left-color:var(--mattone)}
.episodio header{display:flex; flex-wrap:wrap; gap:.4rem 1rem; align-items:baseline; justify-content:space-between}
.episodio h3{margin:0; font-size:1.1rem}
.episodio .chi{margin:.2rem 0 .1rem; color:var(--tenue); font-size:.95rem}
.episodio .racconto{margin:.5rem 0 .25rem; white-space:pre-wrap; max-width:68ch}
.contesto{display:flex; flex-wrap:wrap; gap:.35rem; list-style:none; padding:0; margin:.5rem 0 0}
.contesto li{font-size:.88rem; border:1px solid var(--bordo); border-radius:4px; padding:.05rem .45rem; background:var(--carta)}
.voce-config{color:var(--tenue); font-size:.95rem; margin:.5rem 0; display:flex; align-items:baseline; gap:.25rem; flex-wrap:wrap}
.voce-config .sigla{border-color:var(--tenue)}

/* ---------- ricorrenze ---------- */
.lettura{display:inline-block; font-size:.85rem; font-weight:700; padding:.05rem .5rem; border-radius:4px; border:2px solid; white-space:nowrap}
.lettura.facilitatore{color:var(--lavagna-scura); border-color:var(--lavagna); background:var(--lavagna-chiara)}
.lettura.barriera{color:var(--mattone); border-color:var(--mattone); background:var(--mattone-chiaro)}
.lettura.dipende{color:var(--ocra); border-color:var(--ocra); background:var(--ocra-chiaro)}
.ricorrenze-lista > li.dipende{border-left-color:var(--ocra)}
.lettura.neutra,.lettura.senza_confronto{color:var(--tenue); border-color:var(--bordo)}
.ricorrenze-lista{list-style:none; padding:0; margin:.5rem 0}
.ricorrenze-lista > li{padding:.7rem 0 .7rem 1rem; border-left:4px solid var(--bordo); margin:.5rem 0; background:var(--foglio)}
.ricorrenze-lista > li.facilitatore{border-left-color:var(--lavagna)}
.ricorrenze-lista > li.barriera{border-left-color:var(--mattone)}
.ricorrenze-lista .condizione{font-weight:700; font-size:1.05rem}
.ricorrenze-lista .prove{display:block; color:var(--grafite); font-size:.95rem; margin-top:.15rem}
.ricorrenze-lista .dove{display:block; color:var(--tenue); font-size:.9rem; margin-top:.15rem}
.barra{display:inline-block; vertical-align:middle; width:4.5rem; height:.6rem; border:1px solid var(--bordo); border-radius:3px; margin-right:.4rem; background:linear-gradient(90deg, var(--c,var(--lavagna)) var(--v,0%), transparent var(--v,0%))}
.matrice td,.matrice th{font-size:.92rem; white-space:nowrap}
.matrice td:first-child{white-space:normal; min-width:12rem}
.divergenza{border:1px solid var(--bordo); border-radius:8px; padding:.8rem 1rem; margin:.75rem 0; background:var(--foglio)}

/* ---------- cassetta ---------- */
.voci{list-style:none; padding:0; margin:.5rem 0}
.voci > li{background:var(--foglio); border:1px solid var(--bordo); border-radius:8px; padding:.75rem 1rem; margin:.6rem 0}
.voci .testo-voce{font-weight:700; font-size:1.05rem; margin:0}
.voci .nota-voce{margin:.2rem 0 0; color:var(--grafite)}
.voci .base{display:block; font-size:.88rem; color:var(--tenue); margin-top:.35rem}
.voci .base.debole{color:var(--ocra)}
.proposte > li{border-style:dashed}
.foglio-stampa{background:var(--foglio); border:1px solid var(--bordo); padding:2rem 2.25rem; max-width:48rem; margin:1rem auto; font-size:1.02rem}
.foglio-stampa h1{font-size:1.8rem; margin-bottom:.2rem}
.foglio-stampa h2{font-size:1.2rem; margin-top:1.5rem; padding-bottom:.2rem; border-bottom:2px solid var(--inchiostro)}
.foglio-stampa ul{padding-left:1.2rem}
.foglio-stampa li{margin:.4rem 0}
.foglio-stampa .sotto{color:var(--grafite); font-size:.95rem}
.foglio-stampa .colophon{margin-top:2rem; padding-top:.75rem; border-top:1px solid var(--bordo); font-size:.85rem; color:var(--tenue)}
@media print{
  .non-stampa,.salta,#avviso-archivio,.toast{display:none!important}
  main{padding:0; max-width:none}
  .foglio-stampa{border:none; padding:0; margin:0; max-width:none; color:#000; background:#fff}
  .foglio-stampa h2{border-color:#000; break-after:avoid}
  .foglio-stampa li{break-inside:avoid}
  @page{margin:18mm}
}

/* ---------- spazi ---------- */
.scheda-spazio{background:var(--foglio); border:1px solid var(--bordo); border-left:6px solid var(--bordo); border-radius:6px 10px 10px 6px; padding:.9rem 1.1rem; margin:.75rem 0}
.scheda-spazio.facilitante{border-left-color:var(--lavagna)}
.scheda-spazio.in_parte{border-left-color:var(--ocra)}
.scheda-spazio.inibente{border-left-color:var(--mattone)}
.scheda-spazio header{display:flex; flex-wrap:wrap; gap:.4rem 1rem; align-items:baseline; justify-content:space-between}
.scheda-spazio h3{margin:0}
.scheda-spazio dl{display:grid; grid-template-columns:minmax(9rem,max-content) 1fr; gap:.25rem 1rem; margin:.6rem 0}
.scheda-spazio dt{color:var(--tenue)}
.scheda-spazio dd{margin:0}
.da-cambiare{border-left:4px solid var(--evidenziatore); background:var(--carta); padding:.5rem .8rem; margin:.5rem 0}
@media (max-width:40rem){ .scheda-spazio dl{grid-template-columns:1fr} .scheda-spazio dt{margin-top:.3rem} }

/* ---------- scambi ---------- */
.file-nascosto{position:absolute; width:1px; height:1px; opacity:0; overflow:hidden}
.file-nascosto:focus-visible + label{outline:3px solid var(--focus); outline-offset:2px}
.registro{list-style:none; padding:0; margin:.5rem 0 0}
.registro li{padding:.4rem 0; border-bottom:1px dashed var(--bordo)}
.registro time{display:block; color:var(--tenue); font-size:.88rem}
.scelta-membro{display:grid; gap:.5rem; margin:.75rem 0}
.scelta-membro label{display:flex; gap:.6rem; align-items:center; padding:.5rem .75rem; border:2px solid var(--bordo); border-radius:8px; cursor:pointer}
.scelta-membro input{width:1.2rem; height:1.2rem; accent-color:var(--lavagna)}
.scelta-membro label:has(input:checked){border-color:var(--lavagna); background:var(--lavagna-chiara)}
.riga-check{display:flex; gap:.5rem; align-items:center; margin:.5rem 0}
.riga-check{min-height:44px}
.riga-check input{width:1.4rem; height:1.4rem; accent-color:var(--lavagna)}

footer.piede{max-width:62rem; margin:0 auto; padding:0 1.25rem 2rem; color:var(--tenue); font-size:.9rem}

@media (max-width:40rem){
  h1{font-size:1.6rem}
  .foglio{padding:1rem}
  .marchio span{display:none}
}
@media print{
  body{background:none}
  .testata,.schede,.azioni,footer.piede{display:none}
}

/* ---------- stile tipografico (dalla 0.8) ----------
   Ispirato alla tipografia scolastica di Freinet: carta avorio, inchiostro, rosso tipografico,
   testata da giornalino, timbri. Un solo carattere (Atkinson Hyperlegible): l'app resta autonoma. */
h1{letter-spacing:-.01em}

/* testata come quella di un giornalino di classe */
.testata{background:var(--carta); border-bottom:0; padding:.9rem 1.25rem 0}
.testata-dentro{border-bottom:4px double var(--inchiostro); padding-bottom:.55rem}
.marchio{flex-direction:column; align-items:flex-start; gap:0; padding-top:0}
.marchio b{font-size:1.75rem; letter-spacing:-.01em; line-height:1.1}
.marchio span{text-transform:uppercase; letter-spacing:.14em; font-size:.72rem; color:var(--rosso); font-weight:700}
.testata nav a{font-weight:700}
.testata nav{flex-wrap:wrap}
@media (max-width:22rem){ .testata nav a{font-weight:400; padding:.4rem .55rem} }

/* fogli e riquadri: angoli vivi, filo d'inchiostro, ombra di stampa */
.foglio,.fase,.voci > li,.divergenza,.riassunto div,details.leva-form,.vuoto{border-radius:3px}
.foglio,.fase{border:1.5px solid var(--inchiostro); box-shadow:4px 4px 0 var(--quadretto)}
.ricorrenze-lista > li{border-radius:0}

/* schede delle fasi: maiuscoletto spaziato, sottolineatura rossa */
.schede{border-bottom:1.5px solid var(--inchiostro)}
.schede a{text-transform:uppercase; letter-spacing:.08em; font-size:.92rem; border-radius:0}
.schede a[aria-current="page"]{background:none; color:var(--inchiostro); box-shadow:inset 0 -4px 0 var(--rosso)}
.sottoschede a{border-radius:3px}
.sottoschede a[aria-current="page"]{border-color:var(--inchiostro); background:var(--foglio); box-shadow:2px 2px 0 var(--inchiostro)}

/* pulsanti come blocchetti di stampa */
button,.bottone{border-radius:3px; background:var(--inchiostro); border-color:var(--inchiostro); color:var(--foglio); box-shadow:3px 3px 0 var(--rosso)}
:root[data-tema-attivo="scuro"] button:not(.secondario):not(.pericolo):not(.testuale),
:root[data-tema-attivo="scuro"] .bottone:not(.secondario){color:var(--foglio)}
button:hover,.bottone:hover{background:var(--grafite); border-color:var(--grafite)}
button.secondario,.bottone.secondario{background:var(--foglio); color:var(--inchiostro); border-color:var(--inchiostro); box-shadow:none}
button.secondario:hover,.bottone.secondario:hover{background:var(--carta)}
button.pericolo{box-shadow:none}
button.testuale{box-shadow:none; background:none; color:var(--inchiostro)}
.scelta > span{border-radius:4px}
.scelta input:checked + span{border-color:var(--inchiostro); background:var(--lavagna-chiara); box-shadow:2px 2px 0 var(--inchiostro)}

/* panoramica: le fasi numerate come i paragrafi di un giornalino */
.ciclo{counter-reset:fase}
.fase{border-top-width:1.5px}
.fase h2{font-size:1.35rem; display:flex; align-items:baseline; gap:.5rem}
.fase h2::before{counter-increment:fase; content:counter(fase); font-size:2.2rem; line-height:.8; color:var(--rosso)}
main > h2{border-bottom:1.5px solid var(--inchiostro); padding-bottom:.25rem}

/* timbri: le letture e gli esiti come timbri a inchiostro */
.lettura,.esito{background:transparent; border:3px double currentColor; border-radius:3px;
  text-transform:uppercase; letter-spacing:.1em; font-size:.8rem; padding:.05rem .45rem; transform:rotate(-2.5deg)}
.lettura{display:inline-block}
.lettura.facilitatore,.esito.funziona{color:var(--lavagna-scura); background:transparent}
.lettura.barriera,.esito.non_funziona{color:var(--rosso); background:transparent}
.lettura.dipende,.esito.in_parte{background:transparent}
.ricorrenze-lista > li{border-left-width:0; border-top:1px solid var(--bordo); background:transparent; padding-left:0}
.ricorrenze-lista .condizione{font-size:1.1rem}

/* cassetta: sezioni con il fregio, voci come colonne di giornale */
h3.sezione-cassetta{text-transform:uppercase; letter-spacing:.1em; font-size:.95rem; color:var(--rosso)}
h3.sezione-cassetta::before{content:"\2766"; letter-spacing:0; display:inline-block; margin-right:.45rem}
.voci > li{border-width:0 0 1px; border-color:var(--bordo); background:transparent; padding:.8rem 0 .9rem}
.proposte > li{border:1.5px dashed var(--bordo); background:var(--foglio); padding:.8rem 1rem}
.voci .testo-voce{font-size:1.12rem}
.voci .base{font-style:italic}

/* campi: un bordo che si vede (almeno 3:1 sul foglio) */
:root{--bordo-campo:#857149}
:root[data-tema-attivo="scuro"]{--bordo-campo:#968B76}
:root[data-contrasto="alto"]{--bordo-campo:var(--bordo)}
input[type=text],input[type=number],input[type=password],input[type=datetime-local],input[type=search],select,textarea{border-color:var(--bordo-campo)}

/* leve della scheda episodio */
details.leva-form > summary b{font-size:1.15rem}

/* stampa della cassetta: un foglio del giornalino */
.foglio-stampa{border:1.5px solid var(--inchiostro); box-shadow:6px 6px 0 var(--quadretto); border-radius:0}
.foglio-stampa h1{font-size:2.4rem; border-bottom:4px double var(--inchiostro); padding-bottom:.35rem; margin-bottom:.4rem}
.foglio-stampa > p.sotto{text-transform:uppercase; letter-spacing:.1em; font-size:.8rem}
.foglio-stampa h2{border-bottom:0; color:var(--rosso); text-transform:uppercase; letter-spacing:.1em; font-size:1rem}
.foglio-stampa h2::before{content:"\2766"; display:inline-block; margin-right:.45rem}
.foglio-stampa li{margin:.55rem 0}
.foglio-stampa .colophon{border-top:4px double var(--inchiostro); font-style:italic}
@media print{
  .foglio-stampa{border:none; box-shadow:none}
  .foglio-stampa h1{border-bottom-color:#000}
  .foglio-stampa h2{color:#8A1C0C}
  .foglio-stampa .colophon{border-top-color:#000}
}
</style>
</head>
<body>
<a class="salta" href="#contenuto">Vai al contenuto</a>
<header class="testata">
  <div class="testata-dentro">
    <a class="marchio" href="#/"><b>Cosa mi aiuta</b><span>osservazione cooperativa del contesto</span></a>
    <nav aria-label="Principale">
      <a href="#/">Fascicoli</a>
      <a href="#/sguardo">Sguardo</a>
      <a href="#/impostazioni">Impostazioni</a>
    </nav>
  </div>
</header>
<div id="avviso-archivio" class="avviso" role="alert" hidden></div>
<main id="contenuto" tabindex="-1"></main>
<footer class="piede">
  <p>Prototipo per il Gruppo Nazionale Inclusione MCE. Versione <span id="versione"></span>.<br>I dati restano su questo dispositivo.</p>
</footer>
<div id="annuncio" class="sr" aria-live="polite"></div>
<dialog id="dialogo" aria-labelledby="dialogo-titolo"></dialog>

<script>
'use strict';

/* =========================================================
   1. COSTANTI E LIBRERIA
   ========================================================= */
const APP_VERSIONE = '0.8.1';

const ESITI = {
  funziona:     { nome:'Ha funzionato', segno:'✓' },
  in_parte:     { nome:'In parte', segno:'◐' },
  non_funziona: { nome:'Non ha funzionato', segno:'✕' }
};

/* Blocco facoltativo della scheda episodio: l'alunno in questa situazione.
   Dalla griglia neuropsicomotoria 0-4: modalità comunicative e loro funzioni, interazione con i pari,
   frustrabilità e consolabilità, modificazione del comportamento, stereotipie "in quali situazioni".
   I comportamenti sono letti come messaggi: servono a capire in quali contesti compaiono. */
const BLOCCO_ALUNNO = [
  {id:'espressione', nome:'Come si è espresso', tipo:'multi', opzioni:['sguardo','gesto per indicare o mostrare','gesto che descrive','vocalizzi','parole singole','frasi','immagini o CAA','portando l\'adulto o l\'oggetto','azioni per entrare in relazione (spingere, prendere il gioco)']},
  {id:'funzioni', nome:'Per fare cosa', tipo:'multi', opzioni:['chiedere','mostrare','commentare','condividere','rifiutare','accompagnare ciò che faceva','raccontare']},
  {id:'compagni', nome:'Con i compagni', tipo:'scelta', opzioni:['li ha cercati','ha accolto chi si avvicinava','accanto, ciascuno per sé','ha condiviso il gioco o il lavoro','ha preferito stare per conto suo']},
  {id:'segnali', nome:'Segnali di disagio', tipo:'multi', opzioni:['nessuno','pianto','si è bloccato o ritirato','si è allontanato','agitazione motoria','movimenti ripetitivi','gesti che possono far male a sé','gesti che possono far male ad altri','ha lanciato o rotto oggetti']},
  {id:'andamento', nome:'Durante l\'attività', tipo:'scelta', opzioni:['stabile','è andata meglio via via','è andata peggio via via']},
  {id:'cambiamento', nome:'Cosa ha fatto cambiare le cose', tipo:'testo'},
  {id:'calma', nome:'Cosa ha aiutato a ritrovare la calma', tipo:'multi', opzioni:['un adulto vicino','un oggetto personale','uno spazio tranquillo','una pausa','muoversi','sapere cosa succede dopo','un contatto fisico','il silenzio','musica o una canzone','un compagno']},
  {id:'calma_altro', nome:'Altro che ha aiutato', tipo:'testo'}
];
const SEGNALI_DISAGIO = BLOCCO_ALUNNO.find(c => c.id === 'segnali').opzioni.filter(o => o !== 'nessuno');

/* =========================================================
   CORRETTORE DI SGUARDO — motore
   Riconosce le parole e le costruzioni che spostano l'osservazione
   dal contesto al giudizio sul bambino. Nessuna intelligenza artificiale:
   lessico curato, morfologia italiana, tolleranza agli errori di battitura
   e ai tentativi di aggiramento, controlli sull'intero racconto.
   Non blocca mai: segnala, spiega, fa una domanda, propone un esempio.
   ========================================================= */
const Correttore = (() => {

  /* ---------- categorie ---------- */

  /* nomi propri a metà frase (non all'inizio): probabili nomi di persone */
  const NON_NOMI = new Set(('italiano italiana matematica storia geografia scienze inglese francese spagnolo tedesco musica arte tecnologia religione motoria educazione fisica civica informatica ' +
    'lim natale pasqua carnevale halloween gennaio febbraio marzo aprile maggio giugno luglio agosto settembre ottobre novembre dicembre lunedi martedi mercoledi giovedi venerdi sabato domenica ' +
    'dio gesu madonna italia europa roma milano napoli firenze pisa torino venezia bologna internet google youtube lego playmobil minecraft pokemon peppa word excel powerpoint ' +
    'icf pei glo pdp caa mce bes dsa asl ata oss aec').split(' '));

  function nomiPropri(orig, opz){
    const out = [];
    const alunno = String(opz.nomeAlunno || '').split(/\s+/).map(x => normalizza(x).trim()).filter(x => x.length >= 3);
    const team = new Set((opz.nomiTeam || []).flatMap(x => String(x).split(/\s+/)).map(x => normalizza(x).trim()).filter(x => x.length >= 3));
    const salta = new Set([...(opz.eccezioniNomi || [])].map(x => normalizza(x).trim()));
    const re = /[A-ZÀ-Ý][a-zà-ÿ']{2,}/g; let m;
    while ((m = re.exec(orig))){
      const w = normalizza(m[0]).replace(/'.*$/, '').trim();
      const s = m.index, e = s + m[0].length;
      if (lettera(normalizza(orig[s-1] || ''))) continue;
      if (alunno.includes(w)){ out.push({ cat:'nome', livello:'forte', s, e, voce:m[0], nota:'È il nome dell\'alunno: viaggerebbe nei file del team. Usa il codice.' }); continue; }
      if (NON_NOMI.has(w) || salta.has(w)) continue;
      let k = s - 1; while (k >= 0 && /[\s"«“(\-–—]/.test(orig[k])) k--;
      const inizio = k < 0 || /[.!?:;\n]/.test(orig[k]);
      if (inizio && !team.has(w)) continue;
      out.push({ cat:'nome', livello: team.has(w) ? 'nota' : 'medio', s, e, voce:m[0],
        nota: team.has(w) ? 'Sembra il nome di un collega: nel diario bastano le sigle.' : 'Sembra un nome proprio: per i compagni usa le sigle (per esempio B.L.).' });
    }
    /* il nome dell'alunno anche scritto in minuscolo */
    const n = normalizza(orig);
    for (const a of alunno){
      const r = new RegExp(`(^|[^a-z0-9])(${escRegex(a)})(?![a-z0-9])`, 'g'); let x;
      while ((x = r.exec(n))){ const s = x.index + x[1].length; if (!out.some(o => o.s === s)) out.push({ cat:'nome', livello:'forte', s, e:s + a.length, voce:orig.slice(s, s + a.length), nota:'È il nome dell\'alunno: viaggerebbe nei file del team. Usa il codice.' }); }
    }
    return out;
  }

  /* ---------- analisi ---------- */
  function analizza(testo, opz = {}){
    const orig = String(testo || '');
    if (!orig.trim()) return [];
    const n = normalizza(orig);
    const cit = intervalliCitazione(n);
    let trovate = [];
    const aggiungi = (x) => {
      if (x.e <= x.s) return;
      if (inCitazione(cit, x.s, x.e) && x.cat !== 'nome' && x.cat !== 'clinico'){ x.livello = 'nota'; x.citazione = true; }
      trovate.push(x);
    };
    /* frasi e costruzioni */
    for (const f of FRASI_C.concat(compilaPersonali(opz.personali))){
      f.re.lastIndex = 0; let m;
      while ((m = f.re.exec(n))){
        if (!m[0]){ f.re.lastIndex++; continue; }
        let s = m.index, e = s + m[0].length;
        while (n[s] === ' ') s++;
        if (lettera(n[s-1]) || lettera(n[e])){ f.re.lastIndex = m.index + 1; continue; }
        if (f.esc && f.esc.test(n.slice(e))) continue;
        if (f.soloSempre && m[0].trim() === 'sempre' && /^\s+(?:piu|meno)\b/.test(n.slice(e))) continue;
        if (f.prima && f.prima.test(n.slice(Math.max(0, s - 40), s))) continue;
        aggiungi({ cat:f.cat, livello:f.cat === 'personale' ? (CATEGORIE[f.catBase] ? CATEGORIE[f.catBase].livello : 'medio') : CATEGORIE[f.cat].livello, s, e, voce:f.voce, domandaPersonale:f.domanda, catBase:f.catBase });
      }
    }
    /* parole singole, anche con errori di battitura, asterischi, lettere spaziate */
    const tok = tokenizza(n);
    tok.forEach((t, i) => {
      let voce = null, dist = 0;
      for (const p of PAROLE_C) if (p.re.test(t.t)){ voce = p; break; }
      if (!voce && t.t.length >= 6){
        const max = t.t.length >= 10 ? 2 : 1;
        const libero = /[*0-9]/.test(t.t) || t.unito;
        for (const { f, p } of FORME){
          if (!libero && f.slice(0, 2) !== t.t.slice(0, 2)) continue;
          if (f.length < 6) continue;
          const d = distanza(t.t, f, max);
          if (d <= max){ voce = p; dist = d; break; }
        }
      }
      if (!voce) return;
      if (voce.dopo && tok[i+1] && voce.dopo.test(tok[i+1].t)) return;
      if (voce.prima && voce.prima.test(n.slice(Math.max(0, t.s - 30), t.s))) return;
      const prima = tok.slice(Math.max(0, i - 3), i).map(x => x.t);
      const negata = prima.some(x => NEGAZIONI.has(x));
      aggiungi({ cat:voce.cat, livello: negata ? 'nota' : (voce.livello || CATEGORIE[voce.cat].livello), s:t.s, e:t.e, voce:voce.voce,
        negata, aggirata: dist > 0 || t.unito || /[*]/.test(t.t) });
    });
    /* «è», «era», «sembra» seguiti da un aggettivo di tratto */
    RE_TRATTO.lastIndex = 0; let m;
    while ((m = RE_TRATTO.exec(n))){
      const agg = m[4]; if (TRATTI_NEUTRI.has(agg)) continue;
      const s = m.index + m[1].length, e = m.index + m[0].length;
      aggiungi({ cat:'tratto', livello:'nota', s, e, voce:'è + aggettivo' });
    }
    /* frasi che definiscono il bambino: «È…», «Era…», «Sembra…» a inizio frase, seguiti da un nome o da un aggettivo */
    RE_DEFINIZIONE.lastIndex = 0;
    while ((m = RE_DEFINIZIONE.exec(n))){
      const articolo = m[5]; let parola = m[6], e = m.index + m[0].length;
      if (!parola || TRATTI_NEUTRI.has(parola) || NOMI_NEUTRI.has(parola) || PARTICIPI_EVENTO.has(parola)) continue;
      /* il vero soggetto non è il bambino se la parola è maiuscola nell'originale a metà testo o se «è» è minuscolo senza soggetto esplicito */
      const pv = m.index + m[1].length;
      if (/^[e]$/.test(orig[pv]) && !/(lui|lei|alunn|bambin|ragazz)/.test(m[1])) continue;
      /* «è difficile per lui…», «è importante che…»: costruzione impersonale */
      const dopo = n.slice(e).match(/^\s+([a-z']+)/);
      if (!articolo && dopo && /^(?:per|da|che|a|ad|di|farlo|farla|[a-z]+(?:are|ere|ire))$/.test(dopo[1])) continue;
      /* «è un bambino molto chiuso»: nome di persona seguito da un aggettivo */
      if (NOMI_PERSONA.has(parola)){
        const agg = n.slice(e).match(/^\s+(?:(?:molto|poco|troppo|piuttosto|un po'?|davvero|proprio)\s+)?([a-z]{4,})(?![a-z])/);
        if (!agg || TRATTI_NEUTRI.has(agg[1]) || /^(?:che|di|con|in|a|da|per|nuovo|nuova)$/.test(agg[1])) continue;
        parola = agg[1]; e += agg[0].length;
      }
      if (/^(?:il|lo|la|le|gli|i|in|a|al|alla|da|di|del|della|con|per|su|tra|fra|sempre|mai|qui|li|la|stato|stata|gia|ancora|piu|meno|anche|solo|tutto|tutta|bene|meglio|peggio|ora|oggi|ieri|poi|cosi|come|che|quando|dove|perche|questo|questa|quello|quella)$/.test(parola)) continue;
      const s = m.index + m[1].length;
      const participio = /(?:at|ut|it)[oaie]$/.test(parola);
      const suffissoTratto = /(?:os[oaie]|iv[oaie]|ic[oaie]|abil[ei]|ibil[ei]|ant[ei]|ent[ei]|on[ei]|ott[oaie])$/.test(parola) || /^(?:in|im|ir|dis|s)[a-z]{5,}/.test(parola);
      aggiungi({ cat:'tratto', livello: (articolo || participio || suffissoTratto) ? 'medio' : 'nota', s, e, voce:'È + nome o aggettivo',
        nota: articolo ? 'Definisce il bambino con un nome («è un…», «è una…»): dice com\'è, non cosa ha fatto.' : null });
    }
    /* nomi propri */
    for (const x of nomiPropri(orig, opz)) aggiungi(x);

    if (opz.escludi) trovate = trovate.filter(x => !opz.escludi.includes(x.cat));
    /* nome e cognome vicini diventano una segnalazione sola */
    trovate.sort((a, b) => a.s - b.s);
    for (let k = trovate.length - 1; k > 0; k--){
      const a = trovate[k-1], b = trovate[k];
      if (a.cat === 'nome' && b.cat === 'nome' && /^\s+$/.test(orig.slice(a.e, b.s))){ a.e = b.e; a.livello = LIVELLI[a.livello] >= LIVELLI[b.livello] ? a.livello : b.livello; trovate.splice(k, 1); }
    }
    /* parole che appartengono al contenuto di una lettura o di una lezione («la volpe furba della favola») */
    const RE_CONTENUTO = /(^|[^a-z])(favol[a-z]*|fiab[a-z]*|storia|storie|racconto|raccont[io]|testo|libro|brano|poesia|filastrocca|canzone|film|cartone|personagg[a-z]*|protagonist[a-z]*|lupo|volpe|gatto|cane|orso|leone|topo|drago|strega|principe|principessa|re|regina|capitolo|lettura|leggend[a-z]*|mito)(?![a-z])/;
    for (const x of trovate){
      if (!['etichetta','impegno','stato','tratto','intenzione','disumanizzante'].includes(x.cat) || x.livello === 'nota') continue;
      let a = x.s, b = x.e;
      while (a > 0 && !/[.!?\n]/.test(n[a-1])) a--;
      while (b < n.length && !/[.!?\n]/.test(n[b])) b++;
      if (RE_CONTENUTO.test(n.slice(a, b))){ x.livello = 'nota'; x.nota = 'Se è il contenuto di una lettura o di una lezione va bene. Se invece descrive l\'alunno, prova a raccontare cosa ha fatto.'; }
    }
    /* sovrapposizioni: resta la più grave, a parità la più lunga */
    trovate.sort((a, b) => LIVELLI[b.livello] - LIVELLI[a.livello] || (b.e - b.s) - (a.e - a.s) || a.s - b.s);
    const tenute = [];
    for (const x of trovate) if (!tenute.some(y => x.s < y.e && y.s < x.e)) tenute.push(x);
    tenute.sort((a, b) => a.s - b.s);
    return tenute.map((x, k) => {
      const c = CATEGORIE[x.catBase && CATEGORIE[x.catBase] ? x.catBase : x.cat] || CATEGORIE.personale;
      const fr = frase(orig, x.s, x.e);
      return {
        id:`${x.cat}:${normalizza(orig.slice(x.s, x.e)).trim()}`,
        cat:x.cat, categoria:c.nome, livello:x.livello, inizio:x.s, fine:x.e,
        parola:orig.slice(x.s, x.e), voce:x.voce, frase:fr.testo, posFrase:fr.da,
        perche: x.nota || (x.negata ? 'Anche al negativo è una descrizione del carattere, non di una situazione.' : x.citazione ? 'È tra virgolette: se riporti le parole di qualcuno va bene, scrivi chi le ha dette.' : c.perche),
        domanda: x.domandaPersonale || c.domanda, esempio:c.esempio, aggirata:!!x.aggirata
      };
    });
  }

  /* ---------- controlli sull'intero racconto dell'episodio ---------- */
  const RE_CONTESTO = /(^|[^a-z])(aula|classe|sezione|palestra|mensa|cortile|corridoio|laboratorio|biblioteca|salone|giardino|durante|mentre|quando|dopo|prima|all'inizio|alla fine|compagn[a-z]*|coppia|gruppo|consegn[a-z]*|attivita|scheda|esercizi[a-z]*|lettura|spiegazion[a-z]*|lezione|verifica|gioco|minut[a-z]*|ora|insegnante|maestr[a-z]*|docente|prof|ho|abbiamo|gli ho|le ho|l'ho|proposto|proposta|chiesto|mostrato|letto|detto|lavagna|lim|banco|tavolo|tappeto|rumore|silenzio|agenda|immagin[a-z]*|material[a-z]*)(?![a-z])/;
  const RE_ADULTO = /(^|[^a-z])(ho|abbiamo|gli ho|le ho|l'ho|insegnante|maestr[a-z]*|docente|prof|educatr[a-z]*|educator[a-z]*|compagn[a-z]*|classe|gruppo|coppia|proposto|chiesto|mostrato|spiegato|consegn[a-z]*|letto|detto|dato|data)(?![a-z])/;
  const RE_TONO = /(^|[^a-z])((?:ho|abbiamo|avevo|ha|hanno|aveva)\s+(?:alzato\s+la\s+voce|urlato|gridato|perso\s+la\s+pazienza|sorriso|scherzato|sbuffato)|alzando\s+la\s+voce|a\s+voce\s+(?:alta|bassa)|con\s+(?:calma|fermezza|un\s+sorriso|tono\s+[a-z]+|voce\s+[a-z]+|dolcezza|severita|impazienza)|in\s+fretta|di\s+fretta|sorridendo|scherzando|urlando|gridando|tono\s+(?:irritat[a-z]*|brusc[a-z]*|sereno|calmo|deciso|fermo|alterat[a-z]*))(?![a-z])/;
  function controllaRacconto(testo, { leve = 0, esito = '', tono } = {}){
    const t = String(testo || '').trim(); const n = normalizza(t);
    const out = [];
    if (!t){
      if (esito) out.push({ cat:'struttura', livello:'nota', titolo:'Manca il racconto', testo:'Qualche riga su cosa è successo permette ai colleghi di capire l\'episodio e di confrontarlo con i loro.' });
      return out;
    }
    if (t.length < 25) out.push({ cat:'struttura', livello:'nota', titolo:'Racconto molto breve', testo:'Aggiungi dove eravate, cosa era stato proposto e cosa è successo: sono i dettagli che rendono utile l\'episodio.' });
    if (t.length >= 50 && !RE_CONTESTO.test(n) && leve === 0)
      out.push({ cat:'struttura', livello:'medio', titolo:'Il racconto parla solo dell\'alunno', testo:'Non c\'è traccia del contesto: dove eravate, cosa era stato proposto, con chi. Senza contesto l\'episodio non può dire cosa aiuta.' });
    else if (t.length >= 90 && !RE_ADULTO.test(n))
      out.push({ cat:'struttura', livello:'nota', titolo:'E gli adulti, e i compagni?', testo:'Cosa hai fatto tu, o l\'adulto presente? Cosa facevano i compagni? Anche noi facciamo parte del contesto.' });
    if (tono === false && RE_TONO.test(n))
      out.push({ cat:'struttura', livello:'nota', titolo:'Il tono è nel racconto', testo:'Hai descritto il modo in cui è stata data la consegna. Sceglilo anche in «Adulto e consegne», alla voce «Tono della voce»: così entra nelle ricorrenze e il team può vedere quando aiuta e quando ostacola. Vale anche, e soprattutto, per il tuo tono.' });
    if (esito === 'non_funziona' && leve === 0)
      out.push({ cat:'struttura', livello:'medio', titolo:'Non ha funzionato: ma in quale contesto?', testo:'Senza le leve del contesto, questo episodio non potrà dire che cosa ha ostacolato. Apri almeno due leve.' });
    return out;
  }

  return { analizza, controllaRacconto, normalizza, CATEGORIE, FRASI, PAROLE, LIVELLI, distanza, tokenizza };
})();

/* Leve adattate all'ordine di scuola */
function leveBase(lib){
  const l = JSON.parse(JSON.stringify(LEVE_BASE));
  const campo = (leva, id) => l.find(x => x.id === leva).campi.find(c => c.id === id);
  if (lib !== 'I') return l;
  campo('ambiente','spazio').opzioni = ['sezione','angolo del gioco simbolico','angolo costruzioni','angolo lettura','salone','giardino','mensa','bagno'];
  campo('ambiente','posizione').opzioni = ['in cerchio','al tavolo','sul tappeto','vicino all\'insegnante','in disparte'];
  campo('corpo','postura').opzioni = ['seduto al tavolo','seduto a terra o sul tappeto','in piedi','in movimento','sdraiato'];
  campo('gruppo','forma').opzioni = ['individuale','coppia','piccolo gruppo','tutta la sezione','intersezione'];
  l.find(x => x.id === 'gruppo').campi.splice(1, 0,
    {id:'eta', nome:'Età dei compagni vicini', tipo:'scelta', opzioni:['più grandi','stessa età','più piccoli','misti']});
  campo('mediatori','strumenti').opzioni = ['agenda visiva','contrassegno','immagini e foto','albi illustrati','canzoni e filastrocche','materiali sensoriali','giochi strutturati','CAA'];
  campo('tempi','momento').opzioni = ['accoglienza','cerchio','attività strutturata','gioco libero','pranzo','riposo','uscita','cambio di attività'];
  campo('adulto','vicinanza').opzioni = ['accanto','nella sezione a distanza','assente'];
  campo('adulto','chi_consegna').opzioni = ['insegnante di sezione','insegnante di sostegno','educatore o educatrice','compagno o compagna','altro adulto'];
  campo('proposta','tipo').opzioni = ['esplorazione e manipolazione','causa-effetto','gioco motorio','costruzioni e incastri','gioco simbolico o di finzione','attività grafica','ascolto e racconto','canzoni e filastrocche'];
  campo('proposta','collegamento').opzioni = ['stessa attività della sezione','attività adattata','attività diversa'];
  return l;
}

/* Porta le leve di un fascicolo aperto con una versione precedente allo stato attuale,
   senza togliere nulla: aggiunge leve, campi e scelte mancanti. È deterministica,
   quindi dà lo stesso risultato su tutti i dispositivi del team. */
function aggiornaLeve(esistenti, lib){
  const base = leveBase(lib), out = [];
  for (const lb of base){
    const le = (esistenti || []).find(x => x.id === lb.id);
    if (!le){ out.push(lb); continue; }
    const campi = [];
    for (const cb of lb.campi){
      const ce = le.campi.find(x => x.id === cb.id);
      if (!ce){ campi.push(cb); continue; }
      const c = {...ce, nome:cb.nome};
      if (cb.aiuto) c.aiuto = cb.aiuto;
      if (cb.opzioni) c.opzioni = [...ce.opzioni || [], ...cb.opzioni.filter(o => !(ce.opzioni || []).includes(o))];
      campi.push(c);
    }
    for (const ce of le.campi) if (!lb.campi.some(x => x.id === ce.id)) campi.push(ce);
    out.push({...le, nome:lb.nome, icf:lb.icf, campi});
  }
  for (const le of esistenti || []) if (!base.some(x => x.id === le.id)) out.push(le);
  return out;
}

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clona = o => (typeof structuredClone === 'function') ? structuredClone(o) : JSON.parse(JSON.stringify(o));
const adesso = () => new Date().toISOString();

function uuid(){
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map(x => x.toString(16).padStart(2,'0')).join('');
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}
function dataLunga(iso){
  return new Date(iso).toLocaleDateString('it-IT', {day:'numeric', month:'long', year:'numeric'});
}
function dataOra(iso){

  return d.toLocaleDateString('it-IT', {day:'numeric', month:'long', year:'numeric'}) + ', ' +

}
function annoScolasticoCorrente(){
  const d = new Date(); const y = d.getFullYear();
  return d.getMonth() >= 8 ? `${y}/${String(y+1).slice(2)}` : `${y-1}/${String(y).slice(2)}`;
}

/* =========================================================
   3. ARCHIVIO (IndexedDB, con ripiego in memoria)
   ========================================================= */
const Archivio = (() => {
  let db = null, memoria = null;
  const NEGOZI = ['meta','fascicoli','eventi','locale'];

  function apri(){
    return new Promise((ok) => {
      try {
        const r = indexedDB.open('cosa-mi-aiuta', 1);
        r.onupgradeneeded = () => {
          const d = r.result;
          d.createObjectStore('meta');
          d.createObjectStore('fascicoli', {keyPath:'id'});
          const ev = d.createObjectStore('eventi', {keyPath:'chiave'});
          ev.createIndex('fascicolo', 'fascicoloId');
          d.createObjectStore('locale', {keyPath:'fascicoloId'});
        };
        r.onsuccess = () => { db = r.result; ok(true); };
        r.onerror = () => { attivaMemoria(); ok(false); };
        r.onblocked = () => { attivaMemoria(); ok(false); };
      } catch(e){ attivaMemoria(); ok(false); }
    });
  }
  function attivaMemoria(){
    memoria = {}; NEGOZI.forEach(n => memoria[n] = new Map());
  }
  const chiaveDi = (negozio, val, chiave) =>
    chiave !== undefined ? chiave : (negozio === 'fascicoli' ? val.id : negozio === 'eventi' ? val.chiave : val.fascicoloId);

  function richiesta(negozio, modo, fn){
    return new Promise((ok, ko) => {
      const t = db.transaction(negozio, modo);
      const r = fn(t.objectStore(negozio));
      t.oncomplete = () => ok(r ? r.result : undefined);
      t.onerror = () => ko(t.error);
    });
  }
  return {
    apri,
    get persistente(){ return !!db; },
    async leggi(negozio, chiave){
      if (memoria) return clona(memoria[negozio].get(chiave));
      return richiesta(negozio, 'readonly', s => s.get(chiave));
    },
    async scrivi(negozio, val, chiave){
      if (memoria){ memoria[negozio].set(chiaveDi(negozio, val, chiave), clona(val)); return; }
      return richiesta(negozio, 'readwrite', s => chiave !== undefined ? s.put(val, chiave) : s.put(val));
    },
    async tutti(negozio){
      if (memoria) return [...memoria[negozio].values()].map(clona);
      return richiesta(negozio, 'readonly', s => s.getAll());
    },
    async eventiDi(fascicoloId){
      if (memoria) return [...memoria.eventi.values()].filter(e => e.fascicoloId === fascicoloId).map(clona);
      return richiesta('eventi', 'readonly', s => s.index('fascicolo').getAll(fascicoloId));
    },
    async elimina(negozio, chiave){
      if (memoria){ memoria[negozio].delete(chiave); return; }
      return richiesta(negozio, 'readwrite', s => s.delete(chiave));
    },
    /* Ricomincia da capo: toglie tutte le osservazioni (ogni versione) e lascia la configurazione */
    async svuotaFascicolo(id){
      if (memoria){
        for (const [k,e] of memoria.eventi) if (e.fascicoloId === id && e.tipo !== 'configurazione') memoria.eventi.delete(k);
        return;
      }
      return new Promise((ok, ko) => {
        const t = db.transaction('eventi', 'readwrite');
        t.objectStore('eventi').index('fascicolo').openCursor(IDBKeyRange.only(id)).onsuccess = ev => {
          const c = ev.target.result; if (c){ if (c.value.tipo !== 'configurazione') c.delete(); c.continue(); }
        };
        t.oncomplete = () => ok(); t.onerror = () => ko(t.error);
      });
    },
    async eliminaFascicolo(id){
      if (memoria){
        memoria.fascicoli.delete(id); memoria.locale.delete(id);
        for (const [k,e] of memoria.eventi) if (e.fascicoloId === id) memoria.eventi.delete(k);
        return;
      }
      return new Promise((ok, ko) => {
        const t = db.transaction(['fascicoli','eventi','locale'], 'readwrite');
        t.objectStore('fascicoli').delete(id);
        t.objectStore('locale').delete(id);
        const idx = t.objectStore('eventi').index('fascicolo');
        idx.openCursor(IDBKeyRange.only(id)).onsuccess = ev => {
          const c = ev.target.result; if (c){ c.delete(); c.continue(); }
        };
        t.oncomplete = () => ok(); t.onerror = () => ko(t.error);
      });
    }
  };
})();

const S = { profilo:null, impostazioni:null, bozza:null };

const IMPOSTAZIONI_BASE = { scala:1, tema:'auto', contrasto:'normale', spazio:'normale', correttore:'attivo', rilettura:'attiva', parolePersonali:[] };
const S_FILTRI = {};

function nuovoEvento(fascicoloId, tipo, contenuto, autore = S.profilo.id){
  const id = uuid();
  return {
    chiave:`${id}@1`, id, versione:1, tipo, fascicoloId,
    autore, creato:adesso(), formato:FORMATO, rif:null, contenuto
  };
}

/* Nuova versione di un proprio evento (correzione o ritiro): stesso id, versione più alta */
function nuovaVersione(e, contenuto){
  const versione = e.versione + 1;
  return { ...clona(e), chiave:`${e.id}@${versione}`, versione, modificato:adesso(), contenuto };
}
const episodiValidi = eventi => eventi.filter(e => e.tipo === 'episodio' && !e.contenuto.ritirato);

/* Tiene solo la versione più alta di ogni evento */
function eventiCorrenti(lista){
  const m = new Map();
  for (const e of lista){ const p = m.get(e.id); if (!p || e.versione > p.versione) m.set(e.id, e); }
  return [...m.values()];
}

/* Configurazione effettiva = configurazione iniziale + eventi di configurazione in ordine di tempo */
function configEffettiva(f, eventi){
  const c = clona(f.config);
  c.leve = aggiornaLeve(c.leve, ORDINI[f.ordine] ? ORDINI[f.ordine].lib : 'S');
  const conf = eventiCorrenti(eventi)
    .filter(e => e.tipo === 'configurazione')
    .sort((a,b) => a.creato.localeCompare(b.creato) || a.id.localeCompare(b.id));
  for (const e of conf){
    const x = e.contenuto;
    switch (x.azione){
      case 'aggiungi_attivita':
        if (x.personale && !c.attivitaPersonali.some(p => p.cod === x.personale.cod)) c.attivitaPersonali.push(x.personale);
        { const cod = x.personale ? x.personale.cod : x.cod; if (!c.attivita.includes(cod)) c.attivita.push(cod); }
        break;
      case 'togli_attivita':
        c.attivita = c.attivita.filter(k => k !== x.cod); break;
      case 'aggiungi_membro':
        if (!c.membri.some(m => m.id === x.membro.id)) c.membri.push(x.membro); break;
      case 'cambia_referente':
        if (c.membri.some(m => m.id === x.membroId)) c.membri.forEach(m => m.referente = (m.id === x.membroId));
        break;
    }
  }
  return c;
}

function infoAttivita(cod, cfg){
  return ATTIVITA.find(a => a.cod === cod) || (cfg && cfg.attivitaPersonali.find(a => a.cod === cod)) || {cod, nome:cod, dim:'cog', desc:''};
}
function membro(cfg, id){ return cfg.membri.find(m => m.id === id); }

function descriviEvento(e, cfg){
  const x = e.contenuto;
  if (e.tipo === 'configurazione'){
    switch (x.azione){
      case 'apertura': return 'ha aperto il fascicolo.';
      case 'aggiungi_attivita': { const a = x.personale || infoAttivita(x.cod, cfg);
        return `ha aggiunto l'attività «${a.nome}»${x.personale ? ' (proposta dal team)' : ` (${a.cod})`}.`; }
      case 'togli_attivita': return `ha tolto dall'elenco l'attività «${infoAttivita(x.cod, cfg).nome}».`;
      case 'aggiungi_membro': return `ha aggiunto al team ${x.membro.nome} (${x.membro.sigla}).`;
      case 'cambia_referente': { const m = membro(cfg, x.membroId); return `ha affidato il ruolo di referente a ${m ? m.nome : 'un altro membro'}.`; }
    }
  }
  if (e.tipo === 'episodio') return x.ritirato ? 'ha ritirato un proprio episodio.' : 'ha registrato un episodio.';
  if (e.tipo === 'spazio') return x.ritirato ? 'ha ritirato l\'osservazione di uno spazio.'
    : e.versione > 1 ? `ha aggiornato l'osservazione dello spazio «${x.nome}».` : `ha osservato lo spazio «${x.nome}».`;
  if (e.tipo === 'voce_cassetta') return x.ritirato ? 'ha tolto una voce dalla cassetta degli attrezzi.'
    : e.versione > 1 ? `ha modificato una voce della cassetta: «${x.testo}».` : `ha aggiunto alla cassetta degli attrezzi: «${x.testo}».`;
  return 'ha registrato un evento.';
}

async function caricaFascicolo(id){
  const f = await Archivio.leggi('fascicoli', id);
  if (!f) return null;
  const eventi = await Archivio.eventiDi(id);
  const locale = Object.assign({fascicoloId:id, nomeReale:'', mioMembroId:S.profilo.id, inviate:[], registro:[], parola:''},
    (await Archivio.leggi('locale', id)) || {});
  const cfg = configEffettiva(f, eventi);
  return { f, eventi:eventiCorrenti(eventi), locale, cfg };
}

const mqScuro = window.matchMedia('(prefers-color-scheme: dark)');
function applicaImpostazioni(){
  const i = S.impostazioni || IMPOSTAZIONI_BASE;
  const r = document.documentElement;
  r.style.setProperty('--scala', i.scala);
  const scuro = i.tema === 'scuro' || (i.tema === 'auto' && mqScuro.matches);
  r.dataset.temaAttivo = scuro ? 'scuro' : 'chiaro';
  r.dataset.contrasto = i.contrasto;
  r.dataset.spazio = i.spazio;
}
mqScuro.addEventListener('change', applicaImpostazioni);

/* =========================================================
   6. DIALOGO DI CONFERMA
   ========================================================= */
function conferma({titolo, testo, ok='Conferma', annulla='Annulla', pericolo=false, digita=null}){
  return new Promise(risolvi => {
    const d = $('#dialogo');
    d.innerHTML = `
      <h2 id="dialogo-titolo" style="margin-top:0">${esc(titolo)}</h2>
      <p>${testo}</p>
      ${digita ? `<div class="campo"><label for="dialogo-digita">Scrivi <b>${esc(digita)}</b> per confermare</label>
        <input type="text" id="dialogo-digita" autocomplete="off"></div>` : ''}
      <div class="azioni">
        <button type="button" class="${pericolo ? 'pericolo' : ''}" id="dialogo-ok" ${digita ? 'disabled' : ''}>${esc(ok)}</button>
        <button type="button" class="secondario" id="dialogo-annulla">${esc(annulla)}</button>
      </div>`;
    const chiudi = v => { d.close(); risolvi(v); };
    $('#dialogo-ok', d).onclick = () => chiudi(true);
    $('#dialogo-annulla', d).onclick = () => chiudi(false);
    d.oncancel = e => { e.preventDefault(); chiudi(false); };
    if (digita){
      const inp = $('#dialogo-digita', d);
      inp.oninput = () => $('#dialogo-ok', d).disabled = inp.value.trim() !== digita;
    }
    d.showModal();
    (digita ? $('#dialogo-digita', d) : $('#dialogo-annulla', d)).focus();
  });
}

  return {

    attivita:new Set(), personali:[],
    membri:[{id:S.profilo.id, nome:S.profilo.nome, sigla:S.profilo.sigla, ruolo:S.profilo.ruolo, discipline:S.profilo.discipline, referente:true}]

}
function passiHtml(n){
  const nomi = ['Alunno','Cosa osserviamo','Team'];
  return `<ol class="passi" aria-label="Passaggi">${nomi.map((x,i) =>
    `<li ${i+1 === n ? 'aria-current="step"' : ''} class="${i+1 < n ? 'fatto' : ''}">${x}</li>`).join('')}</ol>`;

}

      <p><b>Chi osserva insieme a te?</b> Aggiungi i colleghi del team docente: consiglio di classe o team di sezione. Famiglia ed educatori esterni non osservano: riceveranno le restituzioni.</p>
      ${tabellaMembri(b.membri, S.profilo.id, true)}
      <h2>Aggiungi un collega</h2>
      ${moduloMembro('m')}
      <h2>Referente del fascicolo</h2>
      <p class="nota">Raccoglie i contributi, prepara sintesi e restituzioni. Di solito è il docente di sostegno, ma il team può scegliere diversamente e cambiarlo durante l'anno.</p>
      <form id="form-p3" novalidate>
        <fieldset>
          <legend class="sr">Scegli il referente</legend>
          <div class="scelte">${b.membri.map(m => `
            <label class="scelta"><input type="radio" name="referente" value="${esc(m.id)}" ${m.referente ? 'checked' : ''}><span>${esc(m.nome)}</span></label>`).join('')}
          </div>
        </fieldset>
        <div class="azioni">
          <button type="button" class="secondario" id="p3-indietro">Indietro</button>
          <button type="submit">Apri il fascicolo</button>
        </div>
      </form>
    </div>`, () => {
      legaModuloMembro('m', () => b.membri, m => { b.membri.push(m); annuncia(`${m.nome} aggiunto al team.`); vistaNuovo(); });
      $$('[data-rimuovi]').forEach(btn => btn.addEventListener('click', () => {
        const id = btn.dataset.rimuovi;
        const era = b.membri.find(m => m.id === id);
        b.membri = b.membri.filter(m => m.id !== id);
        if (era && era.referente) b.membri[0].referente = true;
        vistaNuovo();
      }));
      $('#form-p3').addEventListener('change', e => {
        if (e.target.name === 'referente') b.membri.forEach(m => m.referente = (m.id === e.target.value));
      });
      $('#p3-indietro').addEventListener('click', () => { b.passo = 2; vistaNuovo(); });
      $('#form-p3').addEventListener('submit', async e => { e.preventDefault(); await creaFascicolo(b); });
    });
}

async function creaFascicolo(b){
  const id = uuid();
  const personaliUsate = b.personali.filter(p => b.attivita.has(p.cod));
  const f = {
    id, formato:FORMATO, creato:adesso(), creatoDa:S.profilo.id,
    pseudonimo:b.dati.pseudonimo, ordine:b.dati.ordine, classe:b.dati.classe, anno:b.dati.anno,
    config:{
      attivita:[...b.attivita],
      attivitaPersonali:personaliUsate,
      leve:leveBase(ORDINI[b.dati.ordine].lib),
      membri:clona(b.membri)
    }
  };
  await Archivio.scrivi('fascicoli', f);
  await Archivio.scrivi('locale', {fascicoloId:id, nomeReale:b.dati.nomeReale, mioMembroId:S.profilo.id, inviate:[], registro:[], parola:''});
  await Archivio.scrivi('eventi', nuovoEvento(id, 'configurazione', {azione:'apertura'}));
  S.bozza = null;
  annuncia(`Fascicolo ${f.pseudonimo} aperto.`);
  location.hash = `#/f/${id}/panoramica`;
}

/* ---------- 7.4 Fascicolo ---------- */
/* Il fascicolo segue il ciclo dell'osservazione: osservare, leggere, costruire, condividere */
const FASI = [
  {id:'panoramica', nome:'Panoramica', sez:[['panoramica','Panoramica']]},
  {id:'osservare', nome:'Osservare', sez:[['diario','Episodi'],['spazi','Spazi']]},
  {id:'leggere', nome:'Leggere', sez:[['ricorrenze','Cosa aiuta'],['segnali','Segnali e calma'],['comunicazione','Comunicazione'],['parole','Le nostre parole']]},
  {id:'costruire', nome:'Costruire', sez:[['cassetta','Cassetta degli attrezzi']]},
  {id:'condividere', nome:'Condividere', sez:[['scambi','Scambi con il team']]},
  {id:'impostare', nome:'Impostare', sez:[['osserviamo','Cosa osserviamo'],['team','Team']]}
];
const SEZIONI = FASI.flatMap(x => x.sez);
const faseDi = sez => FASI.find(x => x.sez.some(y => y[0] === sez));

async function vistaFascicolo(id, sezione){
  const dati = await caricaFascicolo(id);
  S.datiCorrenti = dati;
  if (!dati){
    mostra(`<h1>Fascicolo non trovato</h1><p>Questo fascicolo non è su questo dispositivo. Forse è stato eliminato.</p>
      <div class="azioni"><a class="bottone" href="#/">Torna ai fascicoli</a></div>`);
    return;
  }
  if (!SEZIONI.some(s => s[0] === sezione)) sezione = 'panoramica';
  const {f, locale} = dati;
  const testa = `
    <div class="intestazione-fascicolo">
      <div>
        <p class="piccolo" style="margin:0"><a href="#/">Fascicoli</a></p>
        <h1>${esc(f.pseudonimo)}${locale.nomeReale ? `<span class="nome-locale">${esc(locale.nomeReale)}</span>` : ''}</h1>
        <p class="meta">${esc(ORDINI[f.ordine].nome)}, ${unitaDi(f.ordine)} ${esc(f.classe)}, anno scolastico ${esc(f.anno)}</p>
      </div>
      <a class="bottone" href="#/f/${esc(id)}/episodio">Registra un episodio</a>
    </div>
    <nav class="schede" aria-label="Fasi del lavoro sul fascicolo">
      ${FASI.map(x => `<a href="#/f/${esc(id)}/${x.sez[0][0]}" class="${x.id === 'impostare' ? 'fase-impostare' : ''}" ${x.id === faseDi(sezione).id ? 'aria-current="page"' : ''}>${x.nome}</a>`).join('')}
    </nav>
    ${faseDi(sezione).sez.length > 1 ? `<nav class="sottoschede" aria-label="${esc(faseDi(sezione).nome)}">
      ${faseDi(sezione).sez.map(([k,n]) => `<a href="#/f/${esc(id)}/${k}" ${k === sezione ? 'aria-current="page"' : ''}>${n}</a>`).join('')}
    </nav>` : ''}`;
  const corpo = {
    panoramica: sezPanoramica, osserviamo: sezOsserviamo, team: sezTeam, diario: sezDiario, spazi: sezSpazi, ricorrenze: sezRicorrenze, segnali: sezSegnali, comunicazione: sezComunicazione, parole: sezParole, cassetta: sezCassetta, scambi: sezScambi
  }[sezione](dati);
  mostra(testa + corpo.html, () => corpo.lega && corpo.lega());
}

async function registraConfig(fid, contenuto, msg){
  const locale = await Archivio.leggi('locale', fid);
  await Archivio.scrivi('eventi', nuovoEvento(fid, 'configurazione', contenuto, locale ? locale.mioMembroId : S.profilo.id));
  annuncia(msg);
  router();
}

function sezPanoramica({f, cfg, locale, eventi}){
  const io = membro(cfg, locale.mioMembroId);
  const referente = cfg.membri.find(m => m.referente);
  const eps = episodiValidi(eventi);
  const oss = new Set(eps.map(e => e.autore)).size;
  const spazi = schedeSpazio(eventi);
  const an = analizzaRicorrenze({cfg, eventi});
  const aiuta = an.trasversali.filter(t => t.tipo === 'facilitatore');
  const consolidati = new Set();
  Object.values(an.perAttivita).forEach(g => g.righe.forEach(r => { if (r.consolidata && r.tipo === 'facilitatore') consolidati.add(r.chiave); }));
  const voci = vociCassetta(eventi);
  const proposte = propostePerCassetta(an, voci, cfg);
  const nuovi = daInviare({eventi, locale});
  const ultimo = (locale.registro || [])[0];
  const fid = esc(f.id);
  return {
    html: `
      <p class="nota" style="margin-top:1rem">Il lavoro sul fascicolo segue un ciclo: si osservano episodi e spazi, si leggono insieme le ricorrenze, si costruisce la cassetta degli attrezzi, si condivide con il team. Poi si torna a osservare.</p>

        <section class="fase" aria-labelledby="f-oss">
          <h2 id="f-oss">Osservare</h2>
          <p><b>${plurale(eps.length, 'episodio', 'episodi')}</b> di ${plurale(oss, 'osservatore', 'osservatori')}; ${plurale(spazi.length, 'spazio osservato', 'spazi osservati')}.</p>
          ${oss < 2 ? '<p class="nota">Le ricorrenze si consolidano solo con almeno due sguardi: coinvolgi un collega.</p>' : ''}
          ${!spazi.length ? '<p class="nota">Osserva anche lo spazio dove l\'alunno passa più tempo.</p>' : ''}
          <div class="azioni"><a class="bottone" href="#/f/${fid}/episodio">Registra un episodio</a><a class="bottone secondario" href="#/f/${fid}/spazi">Spazi</a></div>
        </section>
        <section class="fase ${an.eps.length < 4 ? 'in-attesa' : ''}" aria-labelledby="f-leg">
          <h2 id="f-leg">Leggere</h2>
          ${an.eps.length < 4 ? `<p>Servono almeno 4 episodi perché emergano ricorrenze.</p>` : `
            <p><b>${plurale(consolidati.size, 'condizione consolidata', 'condizioni consolidate')}</b> che aiutano${aiuta.length ? `, ${aiuta.length} in più attività` : ''}.</p>
            ${aiuta.length ? `<ul>${aiuta.slice(0, 3).map(t => `<li>${esc(t.etichetta)}</li>`).join('')}</ul>` : ''}`}
          <div class="azioni"><a class="bottone secondario" href="#/f/${fid}/ricorrenze">Cosa aiuta</a><a class="bottone secondario" href="#/f/${fid}/segnali">Segnali e calma</a></div>
        </section>
        <section class="fase ${!voci.length ? 'in-attesa' : ''}" aria-labelledby="f-cos">
          <h2 id="f-cos">Costruire</h2>
          <p><b>${plurale(voci.length, 'voce', 'voci')}</b> nella cassetta degli attrezzi.</p>
          ${proposte.length ? `<p>${plurale(proposte.length, 'proposta', 'proposte')} dalle osservazioni in attesa di essere discusse.</p>` : ''}
          <div class="azioni"><a class="bottone secondario" href="#/f/${fid}/cassetta">Cassetta degli attrezzi</a></div>
        </section>
        <section class="fase ${nuovi ? '' : 'in-attesa'}" aria-labelledby="f-con">
          <h2 id="f-con">Condividere</h2>
          <p>${nuovi ? `<b>${plurale(nuovi, 'novità', 'novità')}</b> da inviare al team.` : 'Tutto quello che hai scritto è già stato inviato.'}</p>

        <h2 style="margin-top:0">Il tuo ruolo</h2>

            ? 'Sei il <b>referente</b> del fascicolo: raccogli i contributi dei colleghi e prepari sintesi e restituzioni.'
            : `Sei un <b>osservatore</b> del team. Il referente è ${esc(referente ? referente.nome : 'da indicare')}.`)
          : 'Su questo dispositivo non risulti tra i membri del team.'}</p>
        <p class="nota">Fascicolo aperto il ${dataLunga(f.creato)}. ${plurale(cfg.attivita.length, 'attività osservata', 'attività osservate')}, ${plurale(cfg.membri.length, 'docente', 'docenti')} nel team.</p>
