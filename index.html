function sezOsserviamo({f, cfg}){
  const lib = ORDINI[f.ordine].lib;
  const disponibili = ATTIVITA.filter(a => a.ord.includes(lib) && !cfg.attivita.includes(a.cod))
    .concat(cfg.attivitaPersonali.filter(p => !cfg.attivita.includes(p.cod)));
  const perDim = ORDINE_DIMENSIONI.map(dim => {
    const voci = cfg.attivita.map(c => infoAttivita(c, cfg)).filter(a => a.dim === dim);
    if (!voci.length) return '';
    return `
      <section class="dimensione" aria-labelledby="od-${dim}">
        <h3 id="od-${dim}">${esc(DIMENSIONI[dim])}</h3>
        <ul class="attivita-lista">${voci.map(a => `
          <li><div class="attivita-corpo">
            <strong>${esc(a.nome)}</strong><span class="codice">${a.personale ? 'proposta dal team' : esc(a.cod)}</span>
            <p>${esc(descrizione(a, lib))}</p>
            <button type="button" class="testuale" data-togli="${esc(a.cod)}" data-nome="${esc(a.nome)}">Togli dall'elenco</button>
          </div></li>`).join('')}
        </ul>
      </section>`;
  }).join('');
  const leve = cfg.leve.map(l => `
    <div class="leva">
      <h3>${esc(l.nome)}</h3>
      <p class="nota" style="margin:0">ICF: ${esc(l.icf)}</p>
      <ul>${l.campi.map(c => `<li>${esc(c.nome)}${c.opzioni ? `: <span class="nota">${c.opzioni.map(esc).join(', ')}</span>` : ''}</li>`).join('')}</ul>
    </div>`).join('');
  return {
    html: `
      <div class="foglio">
        <h2 style="margin-top:0">Le attività che osserviamo</h2>
        <p class="nota">Ogni modifica compare nel diario e raggiungerà i colleghi con il prossimo scambio. Togliere un'attività non cancella gli episodi già registrati.</p>
        ${perDim || '<p>Nessuna attività nell\'elenco.</p>'}
        ${disponibili.length ? `
          <form id="form-aggiungi-att" style="margin-top:1.5rem" novalidate>
            <div class="campo"><label for="att-lib">Aggiungi un'attività dalla libreria</label>
              <select id="att-lib">${ORDINE_DIMENSIONI.map(dim => {
                const v = disponibili.filter(a => a.dim === dim);
                return v.length ? `<optgroup label="${esc(DIMENSIONI[dim])}">${v.map(a => `<option value="${esc(a.cod)}">${esc(a.nome)}${a.personale ? '' : ` (${esc(a.cod)})`}</option>`).join('')}</optgroup>` : '';
              }).join('')}</select></div>
            <button type="submit" class="secondario">Aggiungi</button>
          </form>` : ''}
      </div>
      ${moduloAttivitaPersonale('op')}
      <h2>Le leve di contesto</h2>
      <p>In ogni episodio il contesto si descrive con queste sei leve, uguali per tutto il team. Nessun campo è obbligatorio.</p>
      <div class="leve">${leve}</div>`,
    lega(){
      $$('[data-togli]').forEach(b => b.addEventListener('click', async () => {
        const ok = await conferma({ titolo:'Togliere l\'attività?', testo:`«${esc(b.dataset.nome)}» non comparirà più tra quelle da osservare. Gli episodi già registrati restano nel diario.`, ok:'Togli' });
        if (ok) registraConfig(f.id, {azione:'togli_attivita', cod:b.dataset.togli}, `Attività «${b.dataset.nome}» tolta dall'elenco.`);
      }));
      const fa = $('#form-aggiungi-att');
      if (fa) fa.addEventListener('submit', e => {
        e.preventDefault();
        const cod = $('#att-lib').value; const a = infoAttivita(cod, cfg);
        registraConfig(f.id, {azione:'aggiungi_attivita', cod}, `Attività «${a.nome}» aggiunta.`);
      });
      collegaSguardoAttivita('op');
      $('#op-form').addEventListener('submit', e => {
        e.preventDefault();
        const a = leggiAttivitaPersonale('op'); if (!a) return;
        registraConfig(f.id, {azione:'aggiungi_attivita', personale:a}, `Attività «${a.nome}» aggiunta.`);
      });
    }
  };
}

function badgeEsito(esito){
  const x = ESITI[esito]; if (!x) return '';
  return `<span class="esito ${esito}"><span aria-hidden="true">${x.segno}</span>${esc(x.nome)}</span>`;
}
function chipContesto(leve, cfg){
  const chip = [];
  for (const l of cfg.leve){
    const v = leve && leve[l.id]; if (!v) continue;
    for (const c of l.campi){
      const x = v[c.id];
      if (x === undefined || x === '' || (Array.isArray(x) && !x.length)) continue;
      const testo = Array.isArray(x) ? x.join(', ') : c.tipo === 'numero' ? `${x} min` : x;
      chip.push(`<li><b>${esc(c.nome.replace(' in minuti',''))}:</b> ${esc(testo)}</li>`);
    }
  }
  return chip.length ? `<ul class="contesto" aria-label="Contesto">${chip.join('')}</ul>` : '';
}
function chipAlunno(a){
  if (!a) return '';
  const chip = [];
  const lista = x => Array.isArray(x) ? x.join(', ') : x;
  if (a.espressione) chip.push(`<li><b>Si è espresso con:</b> ${esc(lista(a.espressione))}${a.funzioni ? ` (per ${esc(lista(a.funzioni))})` : ''}</li>`);
  if (a.compagni) chip.push(`<li><b>Con i compagni:</b> ${esc(a.compagni)}</li>`);
  if (a.segnali) chip.push(`<li class="${a.segnali.includes('nessuno') ? '' : 'segnale'}"><b>Segnali di disagio:</b> ${esc(lista(a.segnali))}</li>`);
  if (a.andamento) chip.push(`<li><b>Andamento:</b> ${esc(a.andamento)}${a.cambiamento ? `, perché ${esc(a.cambiamento)}` : ''}</li>`);
  else if (a.cambiamento) chip.push(`<li><b>Ha fatto cambiare le cose:</b> ${esc(a.cambiamento)}</li>`);
  const calma = (a.calma || []).concat(a.calma_altro ? [a.calma_altro] : []);
  if (calma.length) chip.push(`<li class="calma"><b>Ha aiutato a ritrovare la calma:</b> ${esc(calma.join(', '))}</li>`);
  return chip.length ? `<ul class="contesto" aria-label="L'alunno in questa situazione">${chip.join('')}</ul>` : '';
}
function momentoEpisodio(e){ return new Date(e.tipo === 'episodio' && e.contenuto.quando ? e.contenuto.quando : (e.modificato || e.creato)); }

function cardEpisodio(e, cfg, fid, mio){
  const c = e.contenuto, a = infoAttivita(c.attivita, cfg), aut = membro(cfg, e.autore);
  const ora = momentoEpisodio(e).toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'});
  return `
    <article class="episodio ${esc(c.esito)}" aria-labelledby="ep-${esc(e.id)}">
      <header>
        <h3 id="ep-${esc(e.id)}">${esc(a.nome)}${a.personale ? '' : `<span class="codice">${esc(a.cod)}</span>`}</h3>
        ${badgeEsito(c.esito)}
      </header>
      <p class="chi"><span class="sigla" title="${esc(aut ? aut.nome : '')}">${esc(aut ? aut.sigla : '?')}</span>${esc(aut ? aut.nome : 'Membro non più nel team')}${c.disciplina ? `, ${esc(c.disciplina)}` : ''}, ore ${ora}${e.versione > 1 ? `, corretto il ${dataLunga(e.modificato)}` : ''}</p>
      ${chipContesto(c.leve, cfg)}
      ${c.racconto ? `<p class="racconto">${esc(c.racconto)}</p>` : ''}
      ${chipAlunno(c.alunno)}
      ${c.revisione && c.revisione.tenute && c.revisione.tenute.length ? `<p class="nota" style="margin:.4rem 0 0">Correttore di sguardo: ${c.revisione.tenute.map(t => `«${esc(t.parola)}» tenuta perché ${esc((MOTIVI_SGUARDO.find(m => m[0] === t.motivo) || ['', 'scelta dell\'osservatore'])[1])}`).join('; ')}.</p>` : ''}
      ${e.autore === mio ? `<div class="azioni" style="margin-top:.6rem">
        <a class="bottone secondario" href="#/f/${esc(fid)}/episodio/${esc(e.id)}">Correggi</a>
        <button type="button" class="testuale" data-ritira="${esc(e.id)}">Ritira l'episodio</button></div>` : ''}
    </article>`;
}

function listaDiario({f, cfg, eventi, locale}, fl){
  const tutti = episodiValidi(eventi);
  const filtroAttivo = !!(fl.attivita || fl.dim || fl.autore || fl.esito || fl.disciplina);
  const scelti = tutti.filter(e => {
    const c = e.contenuto;
    return (!fl.attivita || c.attivita === fl.attivita)
      && (!fl.dim || infoAttivita(c.attivita, cfg).dim === fl.dim)
      && (!fl.autore || e.autore === fl.autore)
      && (!fl.esito || c.esito === fl.esito)
      && (!fl.disciplina || (c.disciplina || '').toLowerCase() === fl.disciplina);
  });
  let voci = scelti;
  if (fl.config && !filtroAttivo) voci = voci.concat(eventi.filter(e => e.tipo !== 'episodio' || e.contenuto.ritirato));
  voci.sort((a,b) => momentoEpisodio(b) - momentoEpisodio(a));

  if (!tutti.length && !voci.length) return '';
  let html = `<p class="nota" role="status">${filtroAttivo ? `${scelti.length} su ${tutti.length} episodi` : `${tutti.length} ${tutti.length === 1 ? 'episodio' : 'episodi'}`}</p>`;
  if (!voci.length) return html + `<div class="vuoto"><p style="margin:0">Nessun episodio corrisponde ai filtri scelti.</p></div>`;
  let giorno = '';
  for (const e of voci){
    const d = momentoEpisodio(e);
    const g = d.toLocaleDateString('it-IT', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
    if (g !== giorno){ html += `<h2 class="giorno">${esc(g.charAt(0).toUpperCase() + g.slice(1))}</h2>`; giorno = g; }
    if (e.tipo === 'episodio' && !e.contenuto.ritirato) html += cardEpisodio(e, cfg, f.id, locale.mioMembroId);
    else { const a = membro(cfg, e.autore);
      html += `<p class="voce-config"><span class="sigla">${esc(a ? a.sigla : '?')}</span>${esc(a ? a.nome : 'Un membro')} ${esc(descriviEvento(e, cfg))}</p>`; }
  }
  return html;
}

function sezDiario(dati){
  const {f, cfg, eventi} = dati;
  const fl = S_FILTRI[f.id] || (S_FILTRI[f.id] = {attivita:'', dim:'', autore:'', esito:'', disciplina:'', config:true});
  const eps = episodiValidi(eventi);
  const codici = [...new Set(cfg.attivita.concat(eps.map(e => e.contenuto.attivita)))];
  const discipline = [...new Set(eps.map(e => (e.contenuto.disciplina || '').trim().toLowerCase()).filter(Boolean))].sort();
  const sel = (id, etichetta, opzioni, val) => `
    <div class="campo"><label for="${id}">${etichetta}</label>
      <select id="${id}" data-filtro="${id.slice(3)}"><option value="">Qualsiasi</option>${opzioni.map(([v,t]) => `<option value="${esc(v)}" ${v === val ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div>`;
  return {
    html: `
      ${eps.length ? `
      <form class="foglio filtri" id="form-filtri" aria-label="Filtra il diario">
        ${sel('fl-attivita', 'Attività', codici.map(c => [c, infoAttivita(c, cfg).nome]), fl.attivita)}
        ${sel('fl-dim', 'Dimensione', ORDINE_DIMENSIONI.map(k => [k, DIMENSIONI[k]]), fl.dim)}
        ${sel('fl-autore', 'Chi ha osservato', cfg.membri.map(m => [m.id, `${m.nome} (${m.sigla})`]), fl.autore)}
        ${sel('fl-esito', 'Esito', Object.entries(ESITI).map(([k,x]) => [k, x.nome]), fl.esito)}
        ${discipline.length ? sel('fl-disciplina', 'Disciplina', discipline.map(d => [d, d]), fl.disciplina) : ''}
        <label style="display:flex;gap:.5rem;align-items:center;min-height:2.75rem"><input type="checkbox" id="fl-config" ${fl.config ? 'checked' : ''} style="width:1.2rem;height:1.2rem;accent-color:var(--lavagna)"> Mostra le modifiche al fascicolo</label>
      </form>` : `
      <div class="vuoto" style="margin-top:1.25rem">
        <h2 style="margin-top:0">Nessun episodio, per ora</h2>
        <p>Qui compariranno le osservazioni di tutto il team, in ordine di tempo. Un episodio si registra in un paio di minuti, anche dal telefono.</p>
        <a class="bottone" href="#/f/${esc(f.id)}/episodio">Registra il primo episodio</a>
      </div>`}
      <div id="diario-lista">${listaDiario(dati, fl)}</div>`,
    lega(){
      const ff = $('#form-filtri');
      if (ff) ff.addEventListener('change', e => {
        const t = e.target;
        if (t.id === 'fl-config') fl.config = t.checked; else if (t.dataset.filtro) fl[t.dataset.filtro] = t.value;
        $('#diario-lista').innerHTML = listaDiario(dati, fl);
      });
      $('#diario-lista').addEventListener('click', async e => {
        const b = e.target.closest('[data-ritira]'); if (!b) return;
        const ev = eventi.find(x => x.id === b.dataset.ritira); if (!ev) return;
        const ok = await conferma({ titolo:'Ritirare l\'episodio?',
          testo:'L\'episodio non comparirà più nel diario né nelle letture del team. Nel diario resterà solo la traccia del ritiro, senza contenuto.', ok:'Ritira', pericolo:true });
        if (!ok) return;
        await Archivio.scrivi('eventi', nuovaVersione(ev, {ritirato:true}));
        annuncia('Episodio ritirato.'); router();
      });
    }
  };
}


/* =========================================================
   7.4g CORRETTORE DI SGUARDO: interfaccia
   Si collega a qualsiasi campo di testo libero. Reagisce mentre si scrive,
   spiega, fa una domanda, propone un esempio; si può tenere un'espressione
   dichiarandone il motivo. Prima di salvare propone una rilettura. Non blocca mai.
   ========================================================= */
const LIVELLI_SGUARDO = { forte:'Da riscrivere', medio:'Da chiarire', nota:'Da considerare' };
const MOTIVI_SGUARDO = [
  ['citazione', 'sono parole di qualcuno, riportate tra virgolette'],
  ['contenuto', 'è il contenuto della lezione o di una lettura'],
  ['fatto', 'descrive un fatto che ho osservato'],
  ['altro', 'ho un altro motivo e ne parlerò con il team']
];
const sguardoAttivo = () => !S.impostazioni || S.impostazioni.correttore !== 'spento';

function opzioniSguardo(dati){
  return { nomeAlunno: dati && dati.locale ? dati.locale.nomeReale : '', nomiTeam: dati && dati.cfg ? dati.cfg.membri.map(m => m.nome) : [],
    eccezioniNomi: dati && dati.f ? [dati.f.pseudonimo] : [], personali: (S.impostazioni && S.impostazioni.parolePersonali) || [] };
}

function fraseEvidenziata(x){
  let pos = x.posFrase;
  if (x.frase.slice(pos, pos + x.parola.length) !== x.parola) pos = x.frase.indexOf(x.parola);
  if (pos < 0) return esc(x.frase);
  return esc(x.frase.slice(0, pos)) + '<mark>' + esc(x.parola) + '</mark>' + esc(x.frase.slice(pos + x.parola.length));
}

function creaSguardo(opzBase){
  const campi = [];
  const api = {
    collega(campo, { nome, escludi = [], struttura = null, tenute = [] } = {}){
      if (!campo) return;
      const box = document.createElement('div');
      box.className = 'sguardo'; box.id = campo.id + '-sguardo';
      const stato = document.createElement('p'); stato.className = 'sr'; stato.setAttribute('aria-live', 'polite');
      campo.insertAdjacentElement('afterend', box); box.insertAdjacentElement('afterend', stato);
      const prec = campo.getAttribute('aria-describedby'); campo.setAttribute('aria-describedby', (prec ? prec + ' ' : '') + box.id);
      const c = { campo, nome, escludi, struttura, box, stato, tenute:new Map(tenute.map(t => [t.id, t.motivo])), seg:[], strutt:[], ultimo:-1, aperte:false, timer:null };
      campi.push(c);
      campo.addEventListener('input', () => { clearTimeout(c.timer); c.timer = setTimeout(() => disegna(c), 220); });
      box.addEventListener('click', e => azione(c, e));
      disegna(c);
    },
    aggiorna(){ campi.forEach(disegna); },
    /* segnalazioni ancora aperte, forti o medie, in tutti i campi */
    aperte(){
      return campi.flatMap(c => {
        if (!sguardoAttivo()) return [];
        analizzaCampo(c);
        return c.seg.filter(x => !c.tenute.has(x.id) && x.livello !== 'nota').map(x => ({ c, x }))
          .concat(c.strutt.filter(x => x.livello !== 'nota').map(x => ({ c, s:x })));
      });
    },
    tenute(){
      return campi.flatMap(c => c.seg.filter(x => c.tenute.has(x.id)).map(x => ({ id:x.id, campo:c.nome, parola:x.parola, cat:x.cat, categoria:x.categoria, motivo:c.tenute.get(x.id) })));
    },
    vai(voce){ vaiAllaParola(voce.c, voce.x); }
  };
  function analizzaCampo(c){
    const t = c.campo.value;
    c.seg = Correttore.analizza(t, { ...opzBase, escludi:c.escludi });
    c.strutt = c.struttura ? Correttore.controllaRacconto(t, c.struttura()) : [];
  }
  function disegna(c){
    if (!sguardoAttivo()){ c.box.innerHTML = ''; return; }
    analizzaCampo(c);
    const aperte = c.seg.filter(x => !c.tenute.has(x.id));
    const tenute = c.seg.filter(x => c.tenute.has(x.id));
    const conta = { forte:0, medio:0, nota:0 }; aperte.forEach(x => conta[x.livello]++);
    const totale = aperte.length + c.strutt.length;
    if (totale !== c.ultimo){ c.ultimo = totale; c.stato.textContent = totale ? `Correttore di sguardo: ${totale} ${totale === 1 ? 'osservazione' : 'osservazioni'} sotto il campo ${c.nome}.` : ''; }
    if (!aperte.length && !c.strutt.length && !tenute.length){
      c.box.innerHTML = c.campo.value.trim().length > 60 && c.struttura ? '<p class="sguardo-pulito">Il correttore non trova espressioni da rivedere. Rileggi comunque con le tre domande qui sopra.</p>' : '';
      return;
    }
    const riepilogo = ['forte','medio','nota'].filter(k => conta[k]).map(k => `${conta[k]} ${LIVELLI_SGUARDO[k].toLowerCase()}`).join(', ');
    const mostra = c.aperte ? aperte : aperte.slice(0, 3);
    c.box.innerHTML = `
      ${aperte.length ? `<p class="sguardo-testa"><b>Correttore di sguardo</b><span>${esc(riepilogo)}</span> <a href="#/sguardo" class="piccolo" target="_blank" rel="noopener">Come funziona</a></p>` : ''}
      ${mostra.map(x => `
        <div class="sguardo-voce ${x.livello}" data-id="${esc(x.id)}">
          <p class="sguardo-cat"><span class="sguardo-livello">${LIVELLI_SGUARDO[x.livello]}</span><span>${esc(x.categoria)}</span></p>
          <p class="sguardo-frase">${fraseEvidenziata(x)}</p>
          ${x.aggirata ? '<p class="nota">Scritta in una forma diversa, ma il senso è questo.</p>' : ''}
          <p>${esc(x.perche)}</p>
          ${x.domanda ? `<p class="sguardo-domanda">${esc(x.domanda)}</p>` : ''}
          ${x.esempio ? `<details><summary>Un esempio di riscrittura</summary><p>${esc(x.esempio)}</p></details>` : ''}
          <div class="sguardo-azioni">
            <button type="button" class="secondario" data-riscrivi="${esc(x.id)}">Riscrivi questa frase</button>
            <button type="button" class="testuale" data-tieni="${esc(x.id)}" aria-expanded="false">Va bene così…</button>
          </div>
          <div class="sguardo-motivi" hidden role="group" aria-label="Perché tenere «${esc(x.parola)}»">
            ${MOTIVI_SGUARDO.map(([k, t]) => `<button type="button" class="secondario" data-motivo="${k}" data-per="${esc(x.id)}">${esc(t.charAt(0).toUpperCase() + t.slice(1))}</button>`).join('')}
          </div>
        </div>`).join('')}
      ${aperte.length > mostra.length ? `<button type="button" class="testuale" data-altre>Mostra le altre ${aperte.length - mostra.length}</button>` : ''}
      ${c.strutt.map(x => `<div class="sguardo-struttura ${x.livello}"><b>${esc(x.titolo)}.</b> ${esc(x.testo)}</div>`).join('')}
      ${tenute.map(x => `<p class="sguardo-tenuta">Tenuta: «${esc(x.parola)}», perché ${esc((MOTIVI_SGUARDO.find(m => m[0] === c.tenute.get(x.id)) || ['', 'hai scelto così'])[1])}. <button type="button" class="testuale" data-riapri="${esc(x.id)}">Annulla</button></p>`).join('')}`;
  }
  function vaiAllaParola(c, x){
    const el = c.campo;
    const det = el.closest('details'); if (det) det.open = true;
    el.focus();
    try { el.setSelectionRange(x.inizio, x.fine); } catch(e){}
    el.scrollIntoView({ block:'center', behavior:'smooth' });
  }
  function azione(c, e){
    const b = e.target.closest('button'); if (!b) return;
    const trova = id => c.seg.find(x => x.id === id);
    if (b.dataset.riscrivi){ const x = trova(b.dataset.riscrivi); if (x) vaiAllaParola(c, x); }
    else if (b.dataset.tieni){ const m = b.closest('.sguardo-voce').querySelector('.sguardo-motivi'); m.hidden = !m.hidden; b.setAttribute('aria-expanded', String(!m.hidden)); if (!m.hidden) m.querySelector('button').focus(); }
    else if (b.dataset.motivo){ c.tenute.set(b.dataset.per, b.dataset.motivo); disegna(c); annuncia('Espressione tenuta, con il motivo.'); c.campo.focus(); }
    else if (b.dataset.riapri){ c.tenute.delete(b.dataset.riapri); disegna(c); }
    else if (b.dataset.altre !== undefined){ c.aperte = true; disegna(c); }
  }
  return api;
}

/* rilettura prima del salvataggio: mai un blocco, una pausa per rileggere */
function rileggiPrimaDiSalvare(sg){
  return new Promise(risolvi => {
    if (!sguardoAttivo() || (S.impostazioni && S.impostazioni.rilettura === 'spenta')) return risolvi(true);
    const aperte = sg.aperte();
    if (!aperte.length) return risolvi(true);
    const d = $('#dialogo');
    d.innerHTML = `
      <h2 id="dialogo-titolo" style="margin-top:0">Prima di salvare, una rilettura</h2>
      <p>Il correttore di sguardo ha trovato ${aperte.length === 1 ? 'un\'espressione' : aperte.length + ' espressioni'} da rivedere.</p>
      <ul>${aperte.slice(0, 6).map(v => v.x
        ? `<li><b>«${esc(v.x.parola)}»</b> (${esc(v.c.nome)}): ${esc(v.x.domanda || v.x.perche)}</li>`
        : `<li><b>${esc(v.s.titolo)}</b>: ${esc(v.s.testo)}</li>`).join('')}</ul>
      ${aperte.length > 6 ? `<p class="nota">E altre ${aperte.length - 6}.</p>` : ''}
      <p class="nota">Puoi riscriverle, oppure tenerle indicando il motivo con «Va bene così…». Il salvataggio non è mai bloccato.</p>
      <div class="azioni">
        <button type="button" id="rilettura-torna">Torno a riscrivere</button>
        <button type="button" class="secondario" id="rilettura-salva">Salva così com'è</button>
      </div>`;
    const chiudi = v => { d.close(); risolvi(v); if (!v){ const p = aperte.find(v => v.x); if (p) sg.vai(p); } };
    $('#rilettura-torna', d).onclick = () => chiudi(false);
    $('#rilettura-salva', d).onclick = () => chiudi(true);
    d.oncancel = e => { e.preventDefault(); chiudi(false); };
    d.showModal(); $('#rilettura-torna', d).focus();
  });
}

const TRE_DOMANDE = `<ol class="tre-domande" aria-label="Rileggi in tre domande">
  <li>Ho scritto che cosa ha fatto, non com'è?</li>
  <li>Ho scritto cosa c'era intorno: proposta, compagni, adulti, ambiente?</li>
  <li>Un collega che non c'era capirebbe la scena?</li></ol>`;

/* ---------- 7.4b Scheda episodio ---------- */
function oraLocale(){
  const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0,16);
}

function campoLeva(l, c, v){
  const nome = `leva__${l.id}__${c.id}`, idb = `ep-${l.id}-${c.id}`;
  if (c.tipo === 'scelta') return `
    <div class="sottocampo" role="radiogroup" aria-labelledby="${idb}-l"${c.aiuto ? ` aria-describedby="${idb}-a"` : ''}>
      <span class="etichetta" id="${idb}-l">${esc(c.nome)}</span>
      ${c.aiuto ? `<span class="aiuto" id="${idb}-a">${esc(c.aiuto)}</span>` : ''}
      <div class="scelte compatte">${c.opzioni.map(o => `
        <label class="scelta"><input type="radio" name="${nome}" value="${esc(o)}" ${v === o ? 'checked data-acceso="1"' : ''}><span>${esc(o)}</span></label>`).join('')}</div>
    </div>`;
  if (c.tipo === 'multi') return `
    <div class="sottocampo" role="group" aria-labelledby="${idb}-l">
      <span class="etichetta" id="${idb}-l">${esc(c.nome)}</span>
      <div class="scelte compatte">${c.opzioni.map(o => `
        <label class="scelta"><input type="checkbox" name="${nome}" value="${esc(o)}" ${Array.isArray(v) && v.includes(o) ? 'checked' : ''}><span>${esc(o)}</span></label>`).join('')}</div>
    </div>`;
  if (c.tipo === 'numero') return `
    <div class="sottocampo"><label for="${idb}">${esc(c.nome)}</label>
      <input type="number" id="${idb}" name="${nome}" min="0" max="300" inputmode="numeric" style="max-width:8rem" value="${esc(v)}"></div>`;
  return `
    <div class="sottocampo"><label for="${idb}">${esc(c.nome)}</label>
      <input type="text" id="${idb}" name="${nome}" value="${esc(v)}"></div>`;
}

function leggiEpisodio(form, cfg){
  const v = {
    attivita:$('#ep-att', form).value,
    disciplina:$('#ep-disc', form).value.trim(),
    quando:$('#ep-quando', form).value || oraLocale(),
    leve:{},
    racconto:$('#ep-racconto', form).value.trim(),
    esito:(($('input[name=esito]:checked', form)) || {}).value || ''
  };
  for (const l of cfg.leve){
    const g = {};
    for (const c of l.campi){
      const nome = `leva__${l.id}__${c.id}`;
      if (c.tipo === 'scelta'){ const x = $(`input[name="${nome}"]:checked`, form); if (x) g[c.id] = x.value; }
      else if (c.tipo === 'multi'){ const x = $$(`input[name="${nome}"]:checked`, form).map(i => i.value); if (x.length) g[c.id] = x; }
      else if (c.tipo === 'numero'){ const x = $(`[name="${nome}"]`, form).value; if (x !== '') g[c.id] = Number(x); }
      else { const x = $(`[name="${nome}"]`, form).value.trim(); if (x) g[c.id] = x; }
    }
    if (Object.keys(g).length) v.leve[l.id] = g;
  }
  const a = leggiCampi(form, 'alunno', BLOCCO_ALUNNO);
  /* "nessuno" esclude gli altri segnali */
  if (a.segnali && a.segnali.includes('nessuno') && a.segnali.length > 1) a.segnali = a.segnali.filter(x => x !== 'nessuno');
  if (Object.keys(a).length) v.alunno = a;
  return v;
}

function leggiCampi(form, gruppo, campi){
  const g = {};
  for (const c of campi){
    const nome = `leva__${gruppo}__${c.id}`;
    if (c.tipo === 'scelta'){ const x = $(`input[name="${nome}"]:checked`, form); if (x) g[c.id] = x.value; }
    else if (c.tipo === 'multi'){ const x = $$(`input[name="${nome}"]:checked`, form).map(i => i.value); if (x.length) g[c.id] = x; }
    else if (c.tipo === 'numero'){ const x = $(`[name="${nome}"]`, form).value; if (x !== '') g[c.id] = Number(x); }
    else { const x = $(`[name="${nome}"]`, form).value.trim(); if (x) g[c.id] = x; }
  }
  return g;
}

async function vistaEpisodio(fid, eid){
  const dati = await caricaFascicolo(fid);
  if (!dati) return vistaFascicolo(fid);
  const {f, cfg, locale, eventi} = dati;
  const mio = locale.mioMembroId;
  const chiaveBozza = `bozza-episodio:${fid}`;
  let originale = null, v, bozza = null;

  if (eid){
    originale = eventi.find(e => e.id === eid && e.tipo === 'episodio');
    if (!originale || originale.autore !== mio || originale.contenuto.ritirato){
      mostra(`<h1>Episodio non modificabile</h1>
        <p>Puoi correggere solo gli episodi che hai registrato tu e che non hai ritirato.</p>
        <div class="azioni"><a class="bottone" href="#/f/${esc(fid)}/diario">Torna al diario</a></div>`);
      return;
    }
    v = clona(originale.contenuto);
  } else {
    bozza = await Archivio.leggi('meta', chiaveBozza);
    if (bozza) v = bozza.valori;
    else {
      const miei = episodiValidi(eventi).filter(e => e.autore === mio).sort((a,b) => b.creato.localeCompare(a.creato));

      const contaLeve = () => Object.keys(leggiEpisodio(form, cfg).leve).length;

      for (const [l, c] of testiLeve) sg.collega($(`#ep-${l.id}-${c.id}`), { nome:c.nome.toLowerCase(), tenute:tenutePrima });
      for (const c of BLOCCO_ALUNNO.filter(c => c.tipo === 'testo')) sg.collega($(`#ep-alunno-${c.id}`), { nome:c.nome.toLowerCase(), tenute:tenutePrima });
      form.addEventListener('change', e => { if (e.target.name === 'esito' || (e.target.name || '').startsWith('leva__')) sg.aggiorna(); });

      const aggiorna = () => {
        const val = leggiEpisodio(form, cfg);

        $$('details.leva-form', form).forEach(d => {
          const g = val.leve[d.dataset.leva]; const k = g ? Object.values(g).flat().length : 0;

        });
        return val;
      };
      const salvaBozza = () => {
        if (eid) return;

      };
      form.addEventListener('change', e => {
        const t = e.target;
        if (t.name !== 'leva__alunno__segnali' || !t.checked) return;
        if (t.value === 'nessuno') $$('input[name="leva__alunno__segnali"]', form).forEach(x => { if (x !== t) x.checked = false; });
        else { const n = $('input[name="leva__alunno__segnali"][value="nessuno"]', form); if (n) n.checked = false; }
      });
      form.addEventListener('input', () => { aggiorna(); salvaBozza(); });
      form.addEventListener('change', () => { aggiorna(); salvaBozza(); });
      /* tocca di nuovo una scelta per toglierla */
      form.addEventListener('click', e => {
        const t = e.target;
        if (t.type !== 'radio' || !t.name.startsWith('leva__')) return;
        if (t.dataset.acceso === '1'){ t.checked = false; t.dataset.acceso = ''; aggiorna(); salvaBozza(); }
        else { $$(`input[name="${t.name}"]`, form).forEach(x => x.dataset.acceso = ''); t.dataset.acceso = '1'; }
      });
      aggiorna();

      const sb = $('#scarta-bozza');
      if (sb) sb.addEventListener('click', async () => { await Archivio.elimina('meta', chiaveBozza); vistaEpisodio(fid); });

      const salva = async altro => {
        clearTimeout(timer);
        const val = leggiEpisodio(form, cfg), err = $('#ep-errore');
        if (!val.attivita){ err.textContent = 'Scegli l\'attività osservata.'; err.hidden = false; $('#ep-att').focus(); return; }
        if (!val.esito){ err.textContent = 'Indica com\'è andata: ha funzionato, in parte o non ha funzionato.'; err.hidden = false; $('input[name=esito]').focus(); return; }
        if (!(await rileggiPrimaDiSalvare(sg))) return;
        const tenute = sg.tenute();
        if (tenute.length) val.revisione = { tenute };
        if (eid) await Archivio.scrivi('eventi', nuovaVersione(originale, val));
        else { await Archivio.scrivi('eventi', nuovoEvento(fid, 'episodio', val, mio)); await Archivio.elimina('meta', chiaveBozza); }
        annuncia(eid ? 'Correzione salvata.' : 'Episodio salvato.');
        if (altro) vistaEpisodio(fid); else location.hash = `#/f/${fid}/diario`;
      };
      form.addEventListener('submit', e => { e.preventDefault(); salva(false); });
      const sa = $('#salva-altro'); if (sa) sa.addEventListener('click', () => salva(true));
    });
}

/* =========================================================
   7.4d LETTURA DELLE RICORRENZE
   Confronta episodi riusciti e non riusciti, condizione per condizione.
   Un campo non registrato non vale come "assente". "In parte" conta a metà.
   ========================================================= */
const SOGLIA_EPISODI = 3;      // episodi con la condizione presente
const SOGLIA_OSSERVATORI = 2;  // osservatori diversi
const SOGLIA_SCARTO = 0.3;     // differenza minima tra presenza nei riusciti e nei non riusciti

const NOME_CAMPO = { durata:'Durata', forma:'Gruppo', strumenti:'Mediatori', compagni:'Compagno vicino', eta:'Compagni vicini',
  rumore:'Rumore di fondo', stimoli_visivi:'Stimoli visivi', affollamento:'Persone nello spazio', ausili:'Ausili',
  modo_consegna:'Consegna data', chi_consegna:'Consegna data da', tono_voce:'Tono della voce', tipo_consegna:'Consegna', consegne:'Consegne', tipo:'Proposta', movimento:'Possibilità di muoversi' };
/* Sigle dei compagni dal campo libero: «B.L. e M.T.», «BL MT», «bl, mt» → BL, MT.
   Le parole brevi della frase (e, con, di…) non sono sigle. */
const NON_SIGLE = new Set('A AD AL ALLA ANCHE CHE COL CON DA DAL DEL DELLA DI E ED FRA GLI I IL IN LA LE LO MA NEL NELLA NON O PER POI SIA SU TRA UN UNA UNO'.split(' '));
function sigleCompagni(testo){
  return String(testo).toUpperCase()
    .replace(/([A-ZÀ-Ý])\.(?=[A-ZÀ-Ý]\.)/g, '$1').replace(/\./g, ' ')
    .split(/[\s,;/+-]+/).filter(t => /^[A-ZÀ-Ý]{1,4}$/.test(t) && !NON_SIGLE.has(t));
}
function fasciaDurata(min){ return min <= 10 ? 'fino a 10 minuti' : min <= 20 ? 'da 11 a 20 minuti' : 'oltre 20 minuti'; }

/* Estrae da un episodio: i campi registrati e le condizioni presenti */
function condizioniEpisodio(e, cfg){
  const registrati = new Set(), presenti = new Set();
  const leve = e.contenuto.leve || {};
  for (const l of cfg.leve){
    const v = leve[l.id]; if (!v) continue;
    for (const c of l.campi){
      const x = v[c.id]; if (x === undefined || x === '') continue;
      const ck = `${l.id}|${c.id}`;
      if (c.tipo === 'scelta'){ registrati.add(ck); presenti.add(`${ck}|${x}`); }
      else if (c.tipo === 'multi' && Array.isArray(x) && x.length){ registrati.add(ck); x.forEach(o => presenti.add(`${ck}|${o}`)); }
      else if (c.tipo === 'numero' && c.id === 'durata'){ registrati.add(ck); presenti.add(`${ck}|${fasciaDurata(Number(x))}`); }
      else if (c.id === 'compagni'){
        const sigle = sigleCompagni(x);
        if (sigle.length){ registrati.add(ck); sigle.forEach(t => presenti.add(`${ck}|${t}`)); }
      }
    }
  }
  return {registrati, presenti};
}

function etichettaCondizione(chiave, cfg){
  const [lid, cid, val] = chiave.split('|');
  const l = cfg.leve.find(x => x.id === lid), c = l && l.campi.find(x => x.id === cid);
  const nome = NOME_CAMPO[cid] || (c ? c.nome : cid);
  return `${nome}: ${val}`;
}

function analizzaGruppo(eps, cfg, esitoDi){
  const rec = {}, pres = {}, oss = {};
  const vuoto = () => ({funziona:0, in_parte:0, non_funziona:0});
  for (const e of eps){
    const es = esitoDi ? esitoDi(e) : e.contenuto.esito; if (!ESITI[es]) continue;
    const {registrati, presenti} = condizioniEpisodio(e, cfg);
    registrati.forEach(k => { (rec[k] = rec[k] || vuoto())[es]++; });
    presenti.forEach(k => { (pres[k] = pres[k] || vuoto())[es]++; (oss[k] = oss[k] || new Set()).add(e.autore); });
  }
  const righe = [];
  for (const k of Object.keys(pres)){
    const ck = k.split('|').slice(0,2).join('|');
    const n = rec[ck], p = pres[k];
    const S = n.funziona + n.in_parte / 2, F = n.non_funziona + n.in_parte / 2;
    const sP = p.funziona + p.in_parte / 2, fP = p.non_funziona + p.in_parte / 2;
    const confronto = n.funziona > 0 && n.non_funziona > 0; // servono sia riusciti sia non riusciti in cui la leva è registrata
    const tassoS = S ? sP / S : 0, tassoF = F ? fP / F : 0;
    const scarto = confronto ? tassoS - tassoF : 0;
    const quanti = p.funziona + p.in_parte + p.non_funziona;
    const consolidata = quanti >= SOGLIA_EPISODI && oss[k].size >= SOGLIA_OSSERVATORI;
    let tipo = 'neutra';
    if (!confronto) tipo = 'senza_confronto';
    else if (scarto >= SOGLIA_SCARTO && tassoS >= 0.5) tipo = 'facilitatore';
    else if (scarto <= -SOGLIA_SCARTO && tassoF >= 0.5) tipo = 'barriera';
    righe.push({ chiave:k, etichetta:etichettaCondizione(k, cfg), n, p, scarto, tassoS, tassoF, quanti,
      osservatori:oss[k].size, consolidata, tipo });
  }
  righe.sort((a,b) => b.scarto - a.scarto || b.quanti - a.quanti);
  return righe;
}

/* Campi che, confrontati osservatore per osservatore, direbbero di quale adulto si parla:
   restano nelle ricorrenze di tutto il team, non negli sguardi divergenti (principio: la sintesi non dice mai quale docente). */
const LEVE_PERSONALI = ['adulto|tono_voce', 'adulto|chi_consegna'];

function analizzaRicorrenze({cfg, eventi}){
  const eps = episodiValidi(eventi).filter(e => ESITI[e.contenuto.esito]);
  const perAttivita = {};
  const codici = [...new Set(eps.map(e => e.contenuto.attivita))];
  for (const cod of codici) perAttivita[cod] = { eps:eps.filter(e => e.contenuto.attivita === cod) };
  for (const cod of codici) perAttivita[cod].righe = analizzaGruppo(perAttivita[cod].eps, cfg);

  /* trasversali: condizioni consolidate come facilitatore o barriera in almeno due attività.
     Se aiuta in alcune e ostacola in altre, la lettura è "dipende dall'attività". */
  const trasv = {};
  for (const cod of codici){
    for (const r of perAttivita[cod].righe){
      if (!r.consolidata || (r.tipo !== 'facilitatore' && r.tipo !== 'barriera')) continue;
      const t = trasv[r.chiave] = trasv[r.chiave] || { chiave:r.chiave, etichetta:r.etichetta, aiuta:[], ostacola:[] };
      (r.tipo === 'facilitatore' ? t.aiuta : t.ostacola).push(cod);
    }
  }
  const ordineTipo = {facilitatore:0, barriera:1, dipende:2};
  const trasversali = Object.values(trasv)
    .map(t => ({ ...t, attivita:t.aiuta.concat(t.ostacola),
      tipo: t.aiuta.length && t.ostacola.length ? 'dipende' : t.aiuta.length ? 'facilitatore' : 'barriera' }))
    .filter(t => t.attivita.length >= 2)
    .sort((a,b) => ordineTipo[a.tipo] - ordineTipo[b.tipo] || b.attivita.length - a.attivita.length);

  /* sguardi divergenti: stessa attività, osservatori con esiti opposti */
  const divergenze = [];
  for (const cod of codici){
    const perAut = {};
    for (const e of perAttivita[cod].eps) (perAut[e.autore] = perAut[e.autore] || []).push(e);
    const tassi = Object.entries(perAut).filter(([,l]) => l.length >= 2).map(([aut, l]) => ({
      aut, l, tasso:l.reduce((s,e) => s + (e.contenuto.esito === 'funziona' ? 1 : e.contenuto.esito === 'in_parte' ? .5 : 0), 0) / l.length }));
    if (tassi.length < 2) continue;
    tassi.sort((a,b) => b.tasso - a.tasso);
    const A = tassi[0], B = tassi[tassi.length - 1];
    if (A.tasso < 0.67 || B.tasso > 0.33) continue;
    const presenza = (lista, k) => {
      const ck = k.split('|').slice(0,2).join('|');
      let r = 0, q = 0;
      for (const e of lista){ const c = condizioniEpisodio(e, cfg); if (c.registrati.has(ck)){ r++; if (c.presenti.has(k)) q++; } }
      return {r, q};
    };
    const chiavi = new Set(); for (const e of A.l.concat(B.l)) condizioniEpisodio(e, cfg).presenti.forEach(k => chiavi.add(k));
    const differenze = [];
    for (const k of chiavi){
      if (LEVE_PERSONALI.some(p => k.startsWith(p + '|'))) continue;
      const a = presenza(A.l, k), b = presenza(B.l, k);
      if (!a.r || !b.r) continue;
      const d = a.q / a.r - b.q / b.r;
      if (Math.abs(d) >= 0.5) differenze.push({ etichetta:etichettaCondizione(k, cfg), a, b, d });
    }
    differenze.sort((x,y) => Math.abs(y.d) - Math.abs(x.d));
    divergenze.push({ cod, A, B, differenze:differenze.slice(0, 5) });
  }
  return { eps, perAttivita, trasversali, divergenze, generale:analizzaGruppo(eps, cfg),
    segnali:analizzaSegnali(eps, cfg, ''), calma:contaOpzioni(eps, 'calma'),
    espressione:contaOpzioni(eps, 'espressione'), funzioni:contaOpzioni(eps, 'funzioni'),
    compagni:contaOpzioni(eps, 'compagni'), spazi:schedeSpazio(eventi) };
}

const plurale = (n, uno, molti) => `${n} ${n === 1 ? uno : molti}`;
function proveRiga(r){
  const parti = [];
  if (r.n.funziona) parti.push(`in ${r.p.funziona} su ${r.n.funziona} riusciti`);
  if (r.n.in_parte) parti.push(`${r.p.in_parte} su ${r.n.in_parte} riusciti in parte`);
  if (r.n.non_funziona) parti.push(`${r.p.non_funziona} su ${r.n.non_funziona} non riusciti`);
  return `Presente ${parti.join(', ')}. ${plurale(r.osservatori, 'osservatore', 'osservatori')}.`;
}
function badgeLettura(tipo){
  const t = {facilitatore:'Aiuta', barriera:'Ostacola', dipende:'Dipende dall\'attività', neutra:'Non decisiva', senza_confronto:'Manca il confronto',
    calma:'Aiuta a ritrovare la calma', segnali:'Con i segnali di disagio', espressione:'Punto di forza', spazio:'Dagli spazi'}[tipo];
  const cls = {calma:'facilitatore', espressione:'facilitatore', spazio:'dipende', segnali:'barriera'}[tipo] || tipo;
  return `<span class="lettura ${cls}">${t}</span>`;
}
function barra(v, colore){ return `<span class="barra" aria-hidden="true" style="--v:${Math.round(v*100)}%;--c:${colore}"></span>`; }

function elencoRicorrenze(righe, tipo, vuoto){
  const r = righe.filter(x => x.consolidata && x.tipo === tipo);
  if (!r.length) return `<p class="nota">${vuoto}</p>`;
  return `<ul class="ricorrenze-lista">${r.map(x => `
    <li class="${tipo}"><span class="condizione">${esc(x.etichetta)}</span>
      <span class="prove">${esc(proveRiga(x))}</span></li>`).join('')}</ul>`;
}

function matrice(righe){
  if (!righe.length) return '';
  const cella = (p, n, col) => n ? `${barra(p / n, col)}${p} su ${n}` : '<span class="nota">nessuno</span>';
  return `
    <details style="margin-top:1rem"><summary style="cursor:pointer;font-weight:700">Vedi tutte le condizioni registrate</summary>
    <div class="tabella-scorri" style="margin-top:.75rem"><table class="matrice">
      <caption class="sr">Presenza di ogni condizione negli episodi, per esito</caption>
      <thead><tr><th scope="col">Condizione</th><th scope="col">Riusciti</th><th scope="col">In parte</th><th scope="col">Non riusciti</th><th scope="col">Osservatori</th><th scope="col">Lettura</th></tr></thead>
      <tbody>${righe.map(r => `<tr>
        <td>${esc(r.etichetta)}${r.consolidata ? '' : ' <span class="nota">(pochi dati)</span>'}</td>
        <td>${cella(r.p.funziona, r.n.funziona, 'var(--lavagna)')}</td>
        <td>${cella(r.p.in_parte, r.n.in_parte, 'var(--ocra)')}</td>
        <td>${cella(r.p.non_funziona, r.n.non_funziona, 'var(--mattone)')}</td>
        <td>${r.osservatori}</td>
        <td>${r.consolidata ? badgeLettura(r.tipo) : '<span class="nota">da osservare ancora</span>'}</td></tr>`).join('')}
      </tbody></table></div>
    <p class="nota">Per ogni esito: in quanti episodi la condizione era presente, sul totale degli episodi in cui quella leva è stata registrata.</p>
    </details>`;
}

function dettaglioAttivita(an, cod, cfg){
  const gruppo = cod ? an.perAttivita[cod] : {eps:an.eps, righe:an.generale};
  if (!gruppo) return '<p class="nota">Nessun episodio per questa attività.</p>';
  const conta = {funziona:0, in_parte:0, non_funziona:0};
  gruppo.eps.forEach(e => conta[e.contenuto.esito]++);
  const daOsservare = gruppo.righe.filter(r => !r.consolidata && (r.tipo === 'facilitatore' || r.tipo === 'barriera'));
  return `
    <p>${plurale(gruppo.eps.length, 'episodio', 'episodi')}: ${conta.funziona} riusciti, ${conta.in_parte} in parte, ${conta.non_funziona} non riusciti.</p>
    ${!conta.non_funziona && !conta.in_parte ? '<p class="attenzione">Tutti gli episodi sono riusciti: per capire cosa fa la differenza servono anche osservazioni di situazioni andate meno bene.</p>' : ''}
    ${!conta.funziona && !conta.in_parte ? '<p class="attenzione">Nessun episodio riuscito, per ora: servono anche osservazioni di situazioni andate bene.</p>' : ''}
    <h3>Cosa sembra aiutare</h3>
    ${elencoRicorrenze(gruppo.righe, 'facilitatore', 'Ancora nessuna condizione consolidata.')}
    <h3>Cosa sembra ostacolare</h3>
    ${elencoRicorrenze(gruppo.righe, 'barriera', 'Ancora nessuna condizione consolidata.')}
    ${daOsservare.length ? `<h3>Da osservare ancora</h3>
      <p class="nota">Condizioni che fanno pensare a una differenza, ma con meno di ${SOGLIA_EPISODI} episodi o un solo osservatore.</p>
      <ul class="ricorrenze-lista">${daOsservare.map(r => `<li class="${r.tipo}"><span class="condizione">${esc(r.etichetta)}</span> ${badgeLettura(r.tipo)}
        <span class="prove">${esc(proveRiga(r))}</span></li>`).join('')}</ul>` : ''}
    ${matrice(gruppo.righe)}`;
}


/* ---------- letture dal blocco "L'alunno in questa situazione" ---------- */
/* Frequenza di ogni scelta di un campo del blocco, con gli osservatori */
function contaOpzioni(eps, campo){
  const m = {};
  let base = 0;
  for (const e of eps){
    const x = e.contenuto.alunno && e.contenuto.alunno[campo];
    if (x === undefined) continue;
    base++;
    for (const o of [].concat(x)){
      const r = m[o] = m[o] || {opzione:o, episodi:0, osservatori:new Set()};
      r.episodi++; r.osservatori.add(e.autore);
    }
  }
  return { base, voci:Object.values(m).map(r => ({...r, consolidata:r.episodi >= SOGLIA_EPISODI && r.osservatori.size >= SOGLIA_OSSERVATORI}))
    .sort((a,b) => b.episodi - a.episodi) };
}

/* Condizioni presenti quando compaiono segnali di disagio, rispetto a quando non compaiono.
   Usa lo stesso confronto delle ricorrenze: "con segnali" come non riuscito, "senza" come riuscito. */
function analizzaSegnali(eps, cfg, quale){
  const con = eps.filter(e => e.contenuto.alunno && Array.isArray(e.contenuto.alunno.segnali) && e.contenuto.alunno.segnali.length);
  const haSegnale = e => { const sg = e.contenuto.alunno.segnali; return quale ? sg.includes(quale) : !sg.includes('nessuno'); };
  const righe = analizzaGruppo(con, cfg, e => haSegnale(e) ? 'non_funziona' : 'funziona');
  return { eps:con, conSegnale:con.filter(haSegnale).length, righe, quale };
}
function proveSegnali(r){
  return `Presente in ${r.p.non_funziona} su ${r.n.non_funziona} episodi con segnali, ${r.p.funziona} su ${r.n.funziona} senza. ${plurale(r.osservatori, 'osservatore', 'osservatori')}.`;
}
function elencoFrequenze(lista, vuoto){
  if (!lista.voci.length) return `<p class="nota">${vuoto}</p>`;
  const max = lista.voci[0].episodi;
  return `<ul class="ricorrenze-lista">${lista.voci.map(r => `
    <li class="${r.consolidata ? 'facilitatore' : ''}"><span class="condizione">${barra(r.episodi / max, 'var(--lavagna)')}${esc(r.opzione)}</span>
      <span class="prove">In ${plurale(r.episodi, 'episodio', 'episodi')} su ${lista.base}, ${plurale(r.osservatori.size, 'osservatore', 'osservatori')}${r.consolidata ? '' : ' (da osservare ancora)'}.</span></li>`).join('')}</ul>`;
}

/* =========================================================
   7.4e CASSETTA DEGLI ATTREZZI
   Voci scelte e riscritte dal team a partire dalle ricorrenze (o scritte liberamente).
   Ogni voce è un evento "voce_cassetta": si scambia e si unisce come gli episodi.
   ========================================================= */
const SEZIONI_CASSETTA = [
  ['ogni', 'In ogni momento'],
  ['ambiente', 'Nell\'ambiente'],
  ['comunicare', 'Per comunicare'],
  ['difficolta', 'Quando è in difficoltà'],
  ['rel', DIMENSIONI.rel], ['com', DIMENSIONI.com], ['aut', DIMENSIONI.aut], ['cog', DIMENSIONI.cog],
  ['ostacoli', 'Cosa rende le cose più difficili']
];
const nomeSezioneCassetta = k => (SEZIONI_CASSETTA.find(x => x[0] === k) || [k, k])[1];

/* Frase proposta a partire da una condizione: un punto di partenza da riscrivere */
function frasePerCondizione(chiave, tipo, f){
  const [lid, cid, val] = chiave.split('|');
  const unita = unitaDi(f.ordine);
  /* chi ha dato la consegna: la cassetta va anche alle famiglie e non deve indicare un adulto preciso */
  if (`${lid}|${cid}` === 'adulto|chi_consegna'){
    const compagno = val === 'compagno o compagna';
    if (tipo === 'barriera') return compagno ? 'Consegne passate soltanto da un compagno o una compagna.'
      : 'Il modo in cui arriva la consegna cambia da un adulto all\'altro: concordare insieme come darla.';
    return compagno ? 'Far passare la consegna anche da un compagno o una compagna.'
      : 'Consegne date da un adulto di riferimento, che conosce bene.';
  }
  if (tipo === 'barriera' && `${lid}|${cid}` === 'adulto|tono_voce'){
    const t = {'in fretta':'Consegne date in fretta.', 'con tono irritato':'Un tono irritato nel dare le consegne.',
      'alzando la voce':'Alzare la voce nel dare le consegne.'}[val];
    if (t) return t;
  }
  if (tipo === 'barriera') return `${etichettaCondizione(chiave, {leve:f.config.leve})}.`.replace(/^./, c => c.toUpperCase());
  const m = {
    'adulto|consegne': {'una alla volta':'Dare una consegna alla volta.'},
    'adulto|vicinanza': {'accanto':'Un adulto accanto durante il lavoro.'},
    'adulto|aiuto': v => v === 'nessuno' ? 'Lasciarlo lavorare in autonomia, senza aiuti diretti.' : `Un aiuto ${v} dell'adulto, quando serve.`,
    'gruppo|forma': {'individuale':'Lavorare individualmente.','coppia':'Lavorare in coppia con un compagno.','piccolo gruppo':'Lavorare in piccolo gruppo.'},
    'gruppo|compagni': () => 'Avere vicino un compagno di riferimento.',
    'gruppo|eta': {'più grandi':'Avere vicino compagni più grandi.'},
    'ambiente|rumore': {'contenuto':'Un ambiente con rumore contenuto.'},
    'ambiente|posizione': v => `Posizione: ${v}.`,
    'ambiente|spazio': v => `Spazio: ${v}.`,
    'mediatori|strumenti': v => `Usare ${v}.`,
    'tempi|durata': {'fino a 10 minuti':'Attività brevi, fino a 10 minuti, o spezzate in parti.','da 11 a 20 minuti':'Attività di durata media, fino a 20 minuti.'},
    'tempi|pause': {'sì':'Prevedere pause.'},
    'tempi|momento': v => `Momento favorevole: ${v}.`,
    'proposta|interesse': {'alto':'Proposte che suscitano il suo interesse.'},
    'proposta|struttura': {'molto strutturata':'Attività molto strutturate, con passaggi chiari.','aperta':'Attività aperte, con margini di scelta.'},
    'proposta|collegamento': v => v.startsWith('stessa') ? `Fare la stessa attività della ${unita}.` : `Attività ${v.replace('attività ','')}.`,
    'proposta|tipo': v => `Proposte di questo tipo: ${v}.`,
    'ambiente|rumori_improvvisi': {'no':'Evitare i rumori improvvisi, o anticiparli.'},
    'ambiente|luce': v => `Luce ${v}.`,
    'ambiente|stimoli_visivi': {'pochi':'Un ambiente con pochi stimoli visivi: pareti sobrie, materiali riposti.'},
    'ambiente|affollamento': {'poche':'Spazi con poche persone.'},
    'corpo|postura': v => `Poter stare ${v}.`,
    'corpo|movimento': {'sì':'Poter muoversi durante l\'attività.'},
    'tempi|preavviso': {'sì':'Anticipare i passaggi da un\'attività all\'altra.'},
    'adulto|modo_consegna': {'a voce':'Dare la consegna a voce.','con il gesto':'Accompagnare la consegna con il gesto.','con immagini o dimostrazione':'Dare la consegna con immagini o mostrando cosa fare.','scritta':'Dare la consegna anche per iscritto.'},
    'adulto|tono_voce': {'con calma':'Dare le consegne con calma, a voce bassa e con poche parole.','con un sorriso, in tono scherzoso':'Un tono sereno, anche scherzoso, quando si danno le consegne.','con fermezza, senza alzare la voce':'Consegne chiare e ferme, senza alzare la voce.'},
    'adulto|tipo_consegna': {'di routine':'Consegne legate alle routine che conosce.','legata alla situazione presente':'Consegne legate a ciò che sta accadendo, con gli oggetti in vista.'}
  }[`${lid}|${cid}`];
  const frase = typeof m === 'function' ? m(val) : m && m[val];
  return frase || `${etichettaCondizione(chiave, {leve:f.config.leve})}.`;
}

function vociCassetta(eventi){
  return eventi.filter(e => e.tipo === 'voce_cassetta' && !e.contenuto.ritirato)
    .sort((a,b) => a.creato.localeCompare(b.creato));
}

/* Candidati dalle ricorrenze: trasversali e consolidati per attività, non ancora nella cassetta */
function propostePerCassetta(an, voci, cfg){
  const gia = new Set(voci.filter(v => v.contenuto.fonte).map(v => v.contenuto.fonte.chiave + '#' + v.contenuto.fonte.tipo));
  const out = [], viste = new Set();
  const dipende = new Set(an.trasversali.filter(t => t.tipo === 'dipende').map(t => t.chiave));
  for (const t of an.trasversali){
    if (t.tipo === 'dipende') continue;
    const k = t.chiave + '#' + t.tipo; if (gia.has(k) || viste.has(k) || (t.tipo === 'barriera' && gia.has(t.chiave + '#segnali'))) continue; viste.add(k);
    out.push({chiave:t.chiave, tipo:t.tipo, etichetta:t.etichetta, attivita:t.attivita, sezione:t.tipo === 'barriera' ? 'ostacoli' : 'ogni'});
  }
  for (const [cod, g] of Object.entries(an.perAttivita)){
    for (const r of g.righe){
      if (!r.consolidata || (r.tipo !== 'facilitatore' && r.tipo !== 'barriera') || dipende.has(r.chiave)) continue;
      const k = r.chiave + '#' + r.tipo; if (gia.has(k) || viste.has(k) || (r.tipo === 'barriera' && gia.has(r.chiave + '#segnali'))) continue; viste.add(k);
      out.push({chiave:r.chiave, tipo:r.tipo, etichetta:r.etichetta, attivita:[cod], riga:r,
        sezione:r.tipo === 'barriera' ? 'ostacoli' : infoAttivita(cod, cfg).dim});
    }
  }
  /* le leve dell'ambiente e del corpo vanno nella sezione "Nell'ambiente" */
  for (const x of out) if (x.tipo === 'facilitatore' && /^(ambiente|corpo)\|/.test(x.chiave)) x.sezione = 'ambiente';
  /* cosa ha aiutato a ritrovare la calma */
  for (const r of an.calma.voci.filter(r => r.consolidata)){
    const k = `calma|${r.opzione}`; if (gia.has(k + '#calma')) continue;
    out.push({chiave:k, tipo:'calma', etichetta:`Per ritrovare la calma: ${r.opzione}`, sezione:'difficolta', attivita:[],
      descrizione:`Ha aiutato in ${plurale(r.episodi, 'episodio', 'episodi')}, ${plurale(r.osservatori.size, 'osservatore', 'osservatori')}.`});
  }
  /* condizioni più presenti con i segnali di disagio */
  for (const r of an.segnali.righe.filter(r => r.consolidata && r.tipo === 'barriera')){
    if (gia.has(r.chiave + '#segnali') || gia.has(r.chiave + '#barriera') || viste.has(r.chiave + '#barriera')) continue;
    out.push({chiave:r.chiave, tipo:'segnali', etichetta:r.etichetta, sezione:'ostacoli', attivita:[], descrizione:proveSegnali(r)});
  }
  /* modi di esprimersi: una proposta sola, con i canali consolidati */
  const canali = an.espressione.voci.filter(r => r.consolidata).map(r => r.opzione);
  if (canali.length && !gia.has('espressione#espressione'))
    out.push({chiave:'espressione', tipo:'espressione', etichetta:`Si esprime con: ${canali.join(', ')}`, sezione:'comunicare', attivita:[],
      canali, descrizione:'I modi di esprimersi osservati più spesso, da più docenti.'});
  /* dagli spazi osservati: cosa si potrebbe cambiare */
  for (const x of an.spazi.filter(x => x.contenuto.cambiare)){
    const k = `spazio|${x.id}`; if (gia.has(k + '#spazio')) continue;
    out.push({chiave:k, tipo:'spazio', etichetta:`${x.contenuto.nome}: ${x.contenuto.cambiare}`, sezione:'ambiente', attivita:[],
      testo:x.contenuto.cambiare, descrizione:`Dall'osservazione dello spazio «${x.contenuto.nome}».`});
  }
  out.dipende = [...dipende].map(k => an.trasversali.find(t => t.chiave === k).etichetta);
  return out;
}

const FRASI_CALMA = {'un adulto vicino':'Un adulto vicino, con calma e poche parole.','un oggetto personale':'Poter tenere con sé un oggetto personale.',
  'uno spazio tranquillo':'Poter andare in uno spazio tranquillo.','una pausa':'Fare una pausa.','muoversi':'Potersi muovere.',
  'sapere cosa succede dopo':'Anticipare cosa succede dopo.','un contatto fisico':'Un contatto fisico, se lo accetta.','il silenzio':'Il silenzio intorno.',
  'musica o una canzone':'Musica o una canzone.','un compagno':'La vicinanza di un compagno.'};
function frasePerProposta(x, f){
  if (x.tipo === 'calma'){ const o = x.chiave.slice(6); return FRASI_CALMA[o] || `${o.charAt(0).toUpperCase() + o.slice(1)}.`; }
  if (x.tipo === 'espressione') return `Si esprime soprattutto con: ${x.canali.join(', ')}. Riconoscere questi modi e rispondere.`;
  if (x.tipo === 'spazio') return x.testo;
  if (x.tipo === 'segnali') return `${x.etichetta}: è spesso presente quando compaiono segnali di disagio.`;
  return frasePerCondizione(x.chiave, x.tipo, f);
}

/* Base attuale di una voce: dove la ricorrenza è ancora consolidata oggi */
function baseAttuale(fonte, an, cfg){
  if (!fonte) return {testo:'Voce scritta dal team.', debole:false};
  const debole = {testo:'Oggi non risulta più consolidata: da rivedere insieme.', debole:true};
  if (fonte.tipo === 'calma'){
    const r = an.calma.voci.find(v => `calma|${v.opzione}` === fonte.chiave);
    return r && r.consolidata ? {testo:`Dalle osservazioni: ha aiutato in ${plurale(r.episodi, 'episodio', 'episodi')}.`, debole:false} : debole;
  }
  if (fonte.tipo === 'espressione')
    return an.espressione.voci.some(v => v.consolidata) ? {testo:'Dalle osservazioni sui modi di esprimersi.', debole:false} : debole;
  if (fonte.tipo === 'spazio'){
    const x = an.spazi.find(y => `spazio|${y.id}` === fonte.chiave);
    return x ? {testo:`Dall'osservazione dello spazio «${x.contenuto.nome}».`, debole:false} : {testo:'L\'osservazione dello spazio è stata ritirata: da rivedere.', debole:true};
  }
  if (fonte.tipo === 'segnali'){
    const r = an.segnali.righe.find(y => y.chiave === fonte.chiave);
    return r && r.consolidata && r.tipo === 'barriera' ? {testo:'Dalle osservazioni: più presente quando compaiono segnali di disagio.', debole:false} : debole;
  }
  const dove = [];
  for (const [cod, g] of Object.entries(an.perAttivita)){
    const r = g.righe.find(x => x.chiave === fonte.chiave);
    if (r && r.consolidata && r.tipo === fonte.tipo) dove.push(infoAttivita(cod, cfg).nome.toLowerCase());
  }
  if (!dove.length) return {testo:'Oggi la ricorrenza non risulta più consolidata: da rivedere insieme.', debole:true};
  return {testo:`Dalle osservazioni: ${fonte.tipo === 'barriera' ? 'ostacola' : 'aiuta'} in ${dove.join(', ')}.`, debole:false};
}

function dialogoVoce({titolo, testo = '', nota = '', sezione = 'ogni', spiegazione = ''}){
  return new Promise(risolvi => {
    const d = $('#dialogo');
    d.innerHTML = `
      <h2 id="dialogo-titolo" style="margin-top:0">${esc(titolo)}</h2>
      ${spiegazione ? `<p class="nota">${spiegazione}</p>` : ''}
      <form id="form-voce" novalidate>
        <div class="campo"><label for="voce-testo">Cosa aiuta, in parole semplici</label>
          <span class="aiuto" id="voce-aiuto">Scrivi come lo diresti a un collega che incontra l'alunno per la prima volta.</span>
          <textarea id="voce-testo" rows="3" aria-describedby="voce-aiuto">${esc(testo)}</textarea></div>
        <div class="campo"><label for="voce-nota">Un esempio concreto (facoltativo)</label>
          <textarea id="voce-nota" rows="2" placeholder="per esempio: in matematica le consegne vengono lette una per volta, e la successiva arriva quando la prima è finita">${esc(nota)}</textarea></div>
        <div class="campo"><label for="voce-sezione">Dove va nella cassetta</label>
          <select id="voce-sezione">${SEZIONI_CASSETTA.map(([k,n]) => `<option value="${k}" ${k === sezione ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div>
        <p class="errore" id="voce-errore" role="alert" hidden></p>
        <div class="azioni"><button type="submit">Salva la voce</button><button type="button" class="secondario" id="voce-annulla">Annulla</button></div>
      </form>`;
    const chiudi = v => { d.close(); risolvi(v); };
    $('#voce-annulla', d).onclick = () => chiudi(null);
    d.oncancel = e => { e.preventDefault(); chiudi(null); };
    const sg = creaSguardo(opzioniSguardo(S.datiCorrenti));
    sg.collega($('#voce-testo', d), { nome:'testo della voce' });
    sg.collega($('#voce-nota', d), { nome:'esempio' });
    let avvisato = false;
    $('#form-voce', d).onsubmit = e => {
      e.preventDefault();
      const t = $('#voce-testo', d).value.trim();
      if (!t){ const er = $('#voce-errore', d); er.textContent = 'Scrivi il testo della voce.'; er.hidden = false; $('#voce-testo', d).focus(); return; }
      const aperte = sguardoAttivo() && !(S.impostazioni && S.impostazioni.rilettura === 'spenta') ? sg.aperte() : [];
      if (aperte.length && !avvisato){
        avvisato = true;
        const er = $('#voce-errore', d); er.textContent = `Il correttore di sguardo segnala ${aperte.length === 1 ? 'un\'espressione' : aperte.length + ' espressioni'} da rivedere. Una voce della cassetta la leggeranno colleghi che non conoscono l'alunno: rileggila. Premi di nuovo «Salva la voce» per salvarla così.`; er.hidden = false;
        const p = aperte.find(v => v.x); if (p) sg.vai(p);
        return;
      }
      chiudi({testo:t, nota:$('#voce-nota', d).value.trim(), sezione:$('#voce-sezione', d).value});
    };
    d.showModal(); $('#voce-testo', d).focus();
  });
}

/* =========================================================
   7.4f SPAZI
   Osservazione dell'ambiente in sé, come chiede la nota finale della griglia 0-4:
   ambiente facilitante o inibente, stimoli (luce, suoni), arredi e giochi,
   come sono organizzati e come interferiscono o facilitano la relazione.
   Ogni osservazione è un evento "spazio": si scambia e si unisce come gli episodi.
   ========================================================= */
const LETTURE_SPAZIO = {facilitante:'Facilitante', in_parte:'In parte', inibente:'Inibente'};
function campiSpazio(cfg){
  const amb = cfg.leve.find(l => l.id === 'ambiente');
  const tipi = amb ? (amb.campi.find(c => c.id === 'spazio') || {}).opzioni || [] : [];
  return [
    {id:'tipo', nome:'Tipo di spazio (lo collega agli episodi)', tipo:'scelta', opzioni:tipi},
    {id:'luce', nome:'Luce', tipo:'scelta', opzioni:['naturale','artificiale intensa','soffusa','mista']},
    {id:'rumore', nome:'Rumore di fondo', tipo:'scelta', opzioni:['contenuto','medio','alto']},
    {id:'rumori_improvvisi', nome:'Rumori improvvisi (campanella, porte, voci dal corridoio)', tipo:'scelta', opzioni:['raramente','a volte','spesso']},
    {id:'stimoli_visivi', nome:'Stimoli visivi (pareti, cartelloni, materiali in vista)', tipo:'scelta', opzioni:['pochi','moderati','molti']},
    {id:'affollamento', nome:'Persone di solito presenti', tipo:'scelta', opzioni:['poche','molte']},
    {id:'zona_tranquilla', nome:'Un angolo tranquillo dove ritirarsi', tipo:'scelta', opzioni:['sì','no']},
    {id:'organizzazione', nome:'Angoli, zone e percorsi riconoscibili', tipo:'scelta', opzioni:['sì','in parte','no']},
    {id:'arredi', nome:'Arredi e loro disposizione', tipo:'testo'},
    {id:'materiali', nome:'Giochi e materiali: quali, dove, a portata di mano?', tipo:'testo'},
    {id:'relazione', nome:'Come l\'ambiente facilita o ostacola la relazione', tipo:'testo'},
    {id:'lettura', nome:'Nel complesso, per questo alunno l\'ambiente è', tipo:'scelta', opzioni:Object.keys(LETTURE_SPAZIO)},
    {id:'cambiare', nome:'Cosa si potrebbe cambiare', tipo:'testo'}
  ];
}
const schedeSpazio = eventi => eventi.filter(e => e.tipo === 'spazio' && !e.contenuto.ritirato)
  .sort((a,b) => a.contenuto.nome.localeCompare(b.contenuto.nome, 'it') || b.creato.localeCompare(a.creato));

/* Esiti degli episodi, per tipo di spazio registrato nella leva Ambiente */
function esitiPerSpazio(eventi){
  const m = {};
  for (const e of episodiValidi(eventi)){
    const t = e.contenuto.leve && e.contenuto.leve.ambiente && e.contenuto.leve.ambiente.spazio;
    if (!t || !ESITI[e.contenuto.esito]) continue;
    const x = m[t] = m[t] || {funziona:0, in_parte:0, non_funziona:0, segnali:0, conSegnali:0, osservatori:new Set()};
    x[e.contenuto.esito]++; x.osservatori.add(e.autore);
    const sg = e.contenuto.alunno && e.contenuto.alunno.segnali;
    if (sg){ x.conSegnali++; if (!sg.includes('nessuno')) x.segnali++; }
  }
  return m;
}
function badgeLetturaSpazio(k){
  const cls = {facilitante:'facilitatore', in_parte:'dipende', inibente:'barriera'}[k];
  return k ? `<span class="lettura ${cls}">${esc(LETTURE_SPAZIO[k])}</span>` : '';
}

  const perTipo = esitiPerSpazio(eventi);
  const cambiare = schede.filter(x => x.contenuto.cambiare);
  const unita = unitaDi(f.ordine);
  return {

/* =========================================================
   7.4c SCAMBIO TRA DISPOSITIVI
   Pacchetti cifrati (AES-GCM, chiave da PBKDF2-SHA256), unione senza conflitti
   ========================================================= */
const FORMATO_PACCHETTO = 1;
const ESTENSIONE = '.cmai';
const ITERAZIONI = 600000;
const TIPI_PACCHETTO = {
  avvio:      'Pacchetto di avvio',
  contributo: 'Contributo',
  sintesi:    'Sintesi',
  archivio:   'Archivio di fine anno'
};
const TIPI_EVENTO = ['configurazione','episodio','voce_cassetta','spazio','ipotesi','stato_ipotesi','commento','voce_alunno','rilettura','restituzione'];

const aB64 = u8 => { let x = ''; for (let i = 0; i < u8.length; i += 0x8000) x += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(x); };
const daB64 = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));

async function trasforma(u8, flusso){
  return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(flusso)).arrayBuffer());
}
async function chiaveDa(parola, sale, iterazioni){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(parola.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:sale, iterations:iterazioni, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function cifra(oggetto, parola){
  let dati = new TextEncoder().encode(JSON.stringify(oggetto));
  const compresso = typeof CompressionStream === 'function';
  if (compresso) dati = await trasforma(dati, new CompressionStream('gzip'));
  const sale = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const chiave = await chiaveDa(parola, sale, ITERAZIONI);
  const cifrato = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, chiave, dati));
  return {
    app:'cosa-mi-aiuta', formato:FORMATO_PACCHETTO,
    cifratura:{alg:'AES-GCM', kdf:'PBKDF2-SHA256', iterazioni:ITERAZIONI, sale:aB64(sale), iv:aB64(iv), compresso},
    dati:aB64(cifrato)
  };
}
async function decifra(involucro, parola){
  const c = involucro.cifratura;
  const chiave = await chiaveDa(parola, daB64(c.sale), c.iterazioni);
  let dati = new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:daB64(c.iv)}, chiave, daB64(involucro.dati)));
  if (c.compresso){
    if (typeof DecompressionStream !== 'function') throw new Error('decompressione');
    dati = await trasforma(dati, new DecompressionStream('gzip'));
  }
  return JSON.parse(new TextDecoder().decode(dati));
}

/* ---------- esportazione ---------- */
async function esportaPacchetto(fid, tipo, {tuttiIMiei = false} = {}){
  if (!scambioPossibile()) return;
  const dati = await caricaFascicolo(fid);
  const {f, cfg, locale} = dati;
  const mio = locale.mioMembroId;
  const tutti = await Archivio.eventiDi(fid); // tutte le versioni
  const inv = new Set(locale.inviate || []);
  let eventi;
  if (tipo === 'contributo') eventi = tutti.filter(e => e.autore === mio && (tuttiIMiei || !inv.has(e.chiave)));
  else if (tipo === 'avvio') eventi = tutti.filter(e => e.tipo === 'configurazione');
  else eventi = tutti;
  if (!eventi.length){ annuncia('Non ci sono novità da inviare.'); return; }

  let parola = locale.parola;
  if (!parola){
    const r = await chiediParola({ titolo:'Scegli la parola chiave del team', nuova:true,
      testo:'Il pacchetto verrà cifrato: senza parola chiave nessuno può leggerlo. Usate tutti la stessa e comunicatela a voce, mai nel messaggio con cui mandate il file.' });
    if (!r) return;
    parola = r.parola;
    if (r.ricorda){ locale.parola = parola; await Archivio.scrivi('locale', locale); }
  }
  const io = membro(cfg, mio) || {id:mio, sigla:S.profilo.sigla, nome:S.profilo.nome};
  const contenuto = { tipo, fascicoloId:f.id, creato:adesso(), app:APP_VERSIONE,
    mittente:{id:io.id, sigla:io.sigla, nome:io.nome}, fascicolo:f, eventi };
  annuncia('Preparo il pacchetto cifrato…');
  const involucro = await cifra(contenuto, parola);
  const oggi = new Date().toISOString().slice(0,10);
  const nomeFile = `${f.pseudonimo}_${tipo}_${io.sigla}_${oggi}${ESTENSIONE}`.replace(/[^\p{L}\p{N}._-]+/gu, '-');
  const file = new File([JSON.stringify(involucro)], nomeFile, {type:'application/json'});

  const url = URL.createObjectURL(file);
  const a = document.createElement('a'); a.href = url; a.download = nomeFile;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);

  if (tipo === 'contributo' || tipo === 'sintesi' || tipo === 'archivio'){
    const l = await Archivio.leggi('locale', fid);
    const nuove = new Set(l.inviate || []);
    eventi.filter(e => e.autore === mio).forEach(e => nuove.add(e.chiave));
    l.inviate = [...nuove]; await Archivio.scrivi('locale', l);
  }
  const quanti = tipo === 'contributo' ? `${eventi.length} ${eventi.length === 1 ? 'evento' : 'eventi'}` : `${eventi.length} ${eventi.length === 1 ? 'evento' : 'eventi'} del fascicolo`;
  await aggiungiRegistro(fid, `Preparato: ${TIPI_PACCHETTO[tipo].toLowerCase()} (${quanti}), file ${nomeFile}.`);

  const puoCondividere = navigator.canShare && navigator.canShare({files:[file]});
  const d = $('#dialogo');
  d.innerHTML = `
    <h2 id="dialogo-titolo" style="margin-top:0">${esc(TIPI_PACCHETTO[tipo])}: il file è pronto</h2>
    <p>Il file <b>${esc(nomeFile)}</b> è stato scaricato. Contiene ${esc(quanti)}, cifrati con la parola chiave del team.</p>
    <p>Invialo ${tipo === 'contributo' ? 'al referente' : 'ai colleghi'} con l'email istituzionale, l'area riservata del registro o il drive d'istituto. Evita le chat personali. La parola chiave si comunica a voce.</p>
    <div class="azioni">
      ${puoCondividere ? '<button type="button" id="condividi">Invia con un\'app</button>' : ''}
      <button type="button" class="secondario" id="chiudi-pronto">Chiudi</button>
    </div>`;
  d.oncancel = null;
  $('#chiudi-pronto', d).onclick = () => { d.close(); router(); };
  if (puoCondividere) $('#condividi', d).onclick = async () => {
    try { await navigator.share({files:[file], title:nomeFile}); } catch(e){}
  };
  d.showModal(); $('#chiudi-pronto', d).focus();
}

/* ---------- importazione e unione ---------- */
function eventoValido(e, fid){
  return e && typeof e.id === 'string' && Number.isInteger(e.versione) && e.versione >= 1
    && e.chiave === `${e.id}@${e.versione}` && e.fascicoloId === fid
    && TIPI_EVENTO.includes(e.tipo) && typeof e.autore === 'string' && typeof e.creato === 'string'
    && e.contenuto && typeof e.contenuto === 'object';
}

/* Regole: stessa chiave = già presente; versioni di uno stesso evento accettate solo dallo stesso autore */
function analizzaUnione(entranti, esistenti, fid){
  const presenti = new Set(esistenti.map(e => e.chiave));
  const autoreDi = new Map(), idLocali = new Set();
  for (const e of esistenti){ idLocali.add(e.id); if (!autoreDi.has(e.id)) autoreDi.set(e.id, e.autore); }
  const accettati = [], nuoviId = new Set(), correzioniId = new Set();
  let giaPresenti = 0, scartati = 0;
  for (const e of entranti){
    if (!eventoValido(e, fid)){ scartati++; continue; }
    if (presenti.has(e.chiave)){ giaPresenti++; continue; }
    if (autoreDi.has(e.id) && autoreDi.get(e.id) !== e.autore){ scartati++; continue; }
    autoreDi.set(e.id, e.autore); presenti.add(e.chiave);
    accettati.push(e);
    (idLocali.has(e.id) ? correzioniId : nuoviId).add(e.id);
  }
  return { accettati, nuovi:nuoviId.size, correzioni:correzioniId.size, giaPresenti, scartati };
}

function scambioPossibile(){
  if (window.crypto && crypto.subtle) return true;
  avvisa('Scambio non disponibile', 'Questo browser non permette la cifratura dei pacchetti, di solito perché l\'app è stata aperta in un modo che il browser considera non sicuro. Aprila da un indirizzo https o dal file salvato sul computer, con Chrome, Edge, Firefox o Safari aggiornati.');
  return false;
}

async function importaPacchetto(file){
  if (!scambioPossibile()) return;
  let involucro;
  try { involucro = JSON.parse(await file.text()); } catch(e){ involucro = null; }
  if (!involucro || involucro.app !== 'cosa-mi-aiuta' || !involucro.cifratura){
    return avvisa('File non riconosciuto', 'Questo file non è un pacchetto di Cosa mi aiuta. I pacchetti hanno l\'estensione ' + ESTENSIONE + '.');
  }
  if (involucro.formato > FORMATO_PACCHETTO){
    return avvisa('Pacchetto da una versione più recente', 'Il pacchetto è stato preparato con una versione più recente dell\'app. Chiedi al referente il file aggiornato dell\'app e usa quello.');
  }

  if (involucro.cifratura.compresso && typeof DecompressionStream !== 'function'){
    return avvisa('Browser da aggiornare', 'Questo pacchetto è compresso e il browser di questo dispositivo non sa ancora aprirlo. Aggiorna il sistema: su iPhone e iPad serve almeno iOS 16.4.');
  }
  /* prova prima le parole chiave già ricordate su questo dispositivo */
  let contenuto = null, parolaUsata = null, ricorda = false;
  const note = [...new Set((await Archivio.tutti('locale')).map(l => l.parola).filter(Boolean))];
  for (const p of note){ try { contenuto = await decifra(involucro, p); parolaUsata = p; break; } catch(e){} }
  while (!contenuto){
    const r = await chiediParola({ titolo:'Parola chiave del team',
      testo:`Per aprire <b>${esc(file.name)}</b> serve la parola chiave che il team ha concordato.` });
    if (!r) return;
    annuncia('Apro il pacchetto…');
    try { contenuto = await decifra(involucro, r.parola); parolaUsata = r.parola; ricorda = r.ricorda; }
    catch(e){ await avvisa('Il pacchetto non si apre', 'La parola chiave non è corretta, oppure il file è danneggiato. Controlla le maiuscole e riprova.'); }
  }

  const c = contenuto;
  if (!c || !c.fascicolo || c.fascicolo.id !== c.fascicoloId || !Array.isArray(c.eventi) || !TIPI_PACCHETTO[c.tipo]){
    return avvisa('Pacchetto non valido', 'Il contenuto del pacchetto è incompleto o danneggiato. Chiedi a chi te l\'ha mandato di prepararlo di nuovo.');
  }
  const fid = c.fascicoloId;
  const esiste = await Archivio.leggi('fascicoli', fid);
  if (!esiste && c.tipo === 'contributo'){
    return avvisa('Manca il fascicolo', `Questo è un contributo per il fascicolo <b>${esc(c.fascicolo.pseudonimo)}</b>, che non è su questo dispositivo. Prima importa il pacchetto di avvio o la sintesi preparati dal referente.`);
  }
  const esistenti = esiste ? await Archivio.eventiDi(fid) : [];
  const u = analizzaUnione(c.eventi, esistenti, fid);
  const mitt = c.mittente || {};
  const riepilogo = [
    u.nuovi ? `${u.nuovi} ${u.nuovi === 1 ? 'evento nuovo' : 'eventi nuovi'}` : '',
    u.correzioni ? `${u.correzioni} ${u.correzioni === 1 ? 'correzione' : 'correzioni'}` : '',
    u.giaPresenti ? `${u.giaPresenti} già presenti` : '',
    u.scartati ? `${u.scartati} scartati perché non coerenti` : ''
  ].filter(Boolean).join(', ') || 'nessun evento';

  const ok = await conferma({
    titolo:'Importare il pacchetto?',
    testo:`<b>${esc(TIPI_PACCHETTO[c.tipo])}</b> di ${esc(mitt.nome || 'un collega')} (${esc(mitt.sigla || '?')}), del ${dataOra(c.creato)}.<br>
      Fascicolo <b>${esc(c.fascicolo.pseudonimo)}</b>${esiste ? '' : ', nuovo su questo dispositivo'}.<br>${esc(riepilogo)}.`,
    ok:'Importa'
  });
  if (!ok) return;

  let locale;
  if (!esiste){
    const cfg = configEffettiva(c.fascicolo, c.eventi.filter(e => eventoValido(e, fid)));
    const chi = await scegliMembro(cfg);
    if (!chi) return;
    await Archivio.scrivi('fascicoli', c.fascicolo);
    let mio = chi;
    locale = {fascicoloId:fid, nomeReale:'', mioMembroId:mio, inviate:[], registro:[], parola:''};
    if (chi === '__nuovo'){
      mio = S.profilo.id; locale.mioMembroId = mio;
      await Archivio.scrivi('locale', locale);
      await Archivio.scrivi('eventi', nuovoEvento(fid, 'configurazione', {azione:'aggiungi_membro',
        membro:{id:mio, nome:S.profilo.nome, sigla:S.profilo.sigla, ruolo:S.profilo.ruolo, discipline:S.profilo.discipline, referente:false}}, mio));
    }
  } else {
    locale = Object.assign({inviate:[], registro:[]}, await Archivio.leggi('locale', fid));
  }
  for (const e of u.accettati) await Archivio.scrivi('eventi', e);
  /* gli eventi propri arrivati da un altro dispositivo risultano già inviati */
  const inv = new Set(locale.inviate || []);
  u.accettati.filter(e => e.autore === locale.mioMembroId).forEach(e => inv.add(e.chiave));
  locale.inviate = [...inv];
  if (ricorda && parolaUsata) locale.parola = parolaUsata;
  if (!locale.parola && parolaUsata && note.includes(parolaUsata)) locale.parola = parolaUsata;
  await Archivio.scrivi('locale', locale);
  await aggiungiRegistro(fid, `Importato: ${TIPI_PACCHETTO[c.tipo].toLowerCase()} di ${mitt.sigla || '?'}, ${riepilogo}.`);
  annuncia(`Pacchetto importato: ${riepilogo}.`);
  if (location.hash === `#/f/${fid}/diario`) router(); else location.hash = `#/f/${fid}/diario`;
}

/* ---------- 7.4h Gestione del fascicolo su questo dispositivo ----------
   Elimina e Ricomincia da capo agiscono solo qui: le copie dei colleghi non cambiano. */
async function chiediEliminaFascicolo(fid){
  const dati = await caricaFascicolo(fid); if (!dati) return false;
  const {f} = dati, nuovi = daInviare(dati);
  const ok = await conferma({
    titolo:`Eliminare ${f.pseudonimo}?`,
    testo:`Il fascicolo e tutte le osservazioni salvate su questo dispositivo verranno cancellati. Le copie dei colleghi restano.${nuovi ? ` <b>Attenzione: ${plurale(nuovi, 'evento non è ancora stato inviato', 'eventi non sono ancora stati inviati')}.</b>` : ''}`,
    ok:'Elimina il fascicolo', pericolo:true, digita:f.pseudonimo
  });
  if (!ok) return false;
  await Archivio.eliminaFascicolo(f.id);
  await Archivio.elimina('meta', `bozza-episodio:${f.id}`);
  annuncia(`Fascicolo ${f.pseudonimo} eliminato da questo dispositivo.`);
  return true;
}

async function chiediRicominciaFascicolo(fid){
  const dati = await caricaFascicolo(fid); if (!dati) return false;
  const {f, eventi, locale} = dati;
  const osservazioni = eventi.filter(e => e.tipo !== 'configurazione' && !e.contenuto.ritirato).length;
  const inv = new Set(locale.inviate || []);
  const nuovi = eventi.filter(e => e.tipo !== 'configurazione' && e.autore === locale.mioMembroId && !inv.has(e.chiave)).length;
  const ok = await conferma({
    titolo:`Ricominciare ${f.pseudonimo} da capo?`,
    testo:`Su questo dispositivo verranno cancellati episodi, spazi e voci della cassetta (${plurale(osservazioni, 'osservazione', 'osservazioni')}). Restano attività, leve, team e nome dell'alunno.<br>Le copie dei colleghi non cambiano: se poi importi una loro sintesi o un loro contributo, quelle osservazioni tornano. Per ricominciare tutti insieme, decidetelo in team.${nuovi ? ` <b>Attenzione: ${plurale(nuovi, 'tua osservazione non è ancora stata inviata', 'tue osservazioni non sono ancora state inviate')}.</b>` : ''}`,
    ok:'Ricomincia da capo', pericolo:true, digita:f.pseudonimo
  });
  if (!ok) return false;
  await Archivio.svuotaFascicolo(f.id);
  await Archivio.elimina('meta', `bozza-episodio:${f.id}`);
  await aggiungiRegistro(f.id, `Ricominciato da capo su questo dispositivo: tolte ${plurale(osservazioni, 'osservazione', 'osservazioni')}.`);
  annuncia(`${f.pseudonimo} ricomincia da capo: le osservazioni sono state tolte da questo dispositivo.`);
  return true;
}

   7.9 LO SGUARDO: le parole del correttore, la palestra, le nostre parole
   Il correttore da solo non basta: servono allenamento, parole condivise

const CATEGORIE_VISIBILI = () => Object.keys(Correttore.CATEGORIE)
  .filter(k => k !== 'struttura' && k !== 'personale')
  .sort((a, b) => Correttore.LIVELLI[Correttore.CATEGORIE[b].livello] - Correttore.LIVELLI[Correttore.CATEGORIE[a].livello]);

function formaLeggibile(radice, code){
  const prima = String(code || '').split('|')[0].replace(/\[([a-z])[^\]]*\]/g, '$1').replace(/[?()*+]/g, '');
  const w = radice + prima;
  return /^[a-z']{3,}$/.test(w) ? w : '';
}
function vociCategoria(cat){
  const v = new Set();
  Correttore.FRASI.filter(f => f[0] === cat && f[2]).forEach(f => f[2].split(/,\s*/).forEach(x => x && v.add(x)));
  Correttore.PAROLE.filter(p => p[0] === cat).forEach(p => { const w = p[3] && p[3][0] ? p[3][0] : formaLeggibile(p[1], p[2]); if (w) v.add(w); });
  return [...v];
}

          <li><span><b>«${esc(p.testo)}»</b> · ${esc(nomeCat(p.categoria))}${p.domanda ? `<br><span class="nota">${esc(p.domanda)}</span>` : ''}</span>

      $('#pp-importa').addEventListener('click', async () => {

        let n = 0;
        for (const riga of $('#pp-elenco').value.split(/\n+/)){
          const [t, c, d] = riga.split('|').map(x => (x || '').trim());
          const cat = Correttore.CATEGORIE[c] ? c : (perNome[Correttore.normalizza(c || '').trim()] || 'etichetta');
          if (aggiungi(t, cat, d)) n++;
        }
        await salvaImpostazioni(); lista();
        annuncia(n ? `${plurale(n, 'espressione aggiunta', 'espressioni aggiunte')}.` : 'Nessuna espressione nuova da aggiungere.');
      });
    });
}
