venuto dopo, è passato alla nuova attività in un minuto.", "spunto": "Il linguaggio del controllo descrive noi, non lui. Osservare cosa facciamo noi, e con quale effetto, è parte del contesto." }, { "ordine": "infanzia", "dove": "Giardino, gioco libero", "frase": "Poverino, con tutti i problemi che ha, fa tenerezza.", "riscrittura": "In giardino ha giocato a palla con due compagni per dieci minuti; quando il gioco è diventato a squadre, si è seduto sulla panchina e ha guardato gli altri.", "spunto": "La compassione mette a distanza. Un bambino che gioca, e un gioco che a un certo punto cambia, dicono cosa gli serve." }, { "ordine": "primaria", "dove": "Dettato", "frase": "Ha provocato la maestra per tutta la mattina.", "riscrittura": "Durante il dettato ha ripetuto ad alta voce le parole della maestra, cinque volte in venti minuti. Nel lavoro con i regoli, a coppie, subito dopo, non è successo.", "spunto": "«Provocare» è un'intenzione che leggiamo noi. Due attività della stessa mattina mostrano che cosa cambia." }, { "ordine": "secondaria", "dove": "Ingresso in classe", "frase": "Oggi era nervoso e oppositivo.", "riscrittura": "All'ingresso ha lasciato lo zaino in corridoio. Quando gli ho chiesto di prendere il quaderno ha detto «no» e ha appoggiato la testa sul banco; con il cartellino dell'agenda ha preso il quaderno dopo due minuti.", "spunto": "Gli stati d'animo li interpretiamo noi. I gesti, le parole e ciò che è servito a sbloccare la situazione restano." }, { "ordine": "infanzia", "dove": "Momento del cerchio", "frase": "Non partecipa, sta sempre nel suo mondo.", "riscrittura": "Durante il cerchio del mattino è rimasto sul cuscino ai margini, guardando le mani della maestra; quando è passato il sacchetto degli oggetti, ha tirato fuori la macchinina e l'ha mostrata a S.", "spunto": "«Nel suo mondo» è un'immagine che isola. Dove guarda, cosa lo aggancia, a chi si rivolge: da lì passa la relazione." } ];

/* Le nostre parole: uno specchio del linguaggio del team, non una pagella */
function scrittiDelFascicolo({ cfg, eventi }){
  const out = [];
  const leveTesto = cfg.leve.flatMap(l => l.campi.filter(c => c.tipo === 'testo').map(c => [l.id, c.id]));
  const alunnoTesto = BLOCCO_ALUNNO.filter(c => c.tipo === 'testo').map(c => c.id);
  const spazioTesto = campiSpazio(cfg).filter(c => c.tipo === 'testo').map(c => c.id);
  const str = v => typeof v === 'string' && v.trim();
  for (const e of episodiValidi(eventi)){
    const x = e.contenuto, t = [x.racconto];
    for (const [l, c] of leveTesto) t.push(x.leve && x.leve[l] && x.leve[l][c]);
    for (const c of alunnoTesto) t.push(x.alunno && x.alunno[c]);
    out.push({ e, tipo:'episodio', quando:x.quando || e.creato, testi:t.filter(str), escludi:[] });
  }
  for (const e of schedeSpazio(eventi)) out.push({ e, tipo:'spazio', quando:e.creato, testi:spazioTesto.map(c => e.contenuto[c]).filter(str), escludi:['generalizzazione'] });
  for (const e of vociCassetta(eventi)) out.push({ e, tipo:'cassetta', quando:e.creato, testi:[e.contenuto.testo, e.contenuto.nota].filter(str), escludi:[] });
  return out.filter(s => s.testi.length).sort((a, b) => String(a.quando).localeCompare(String(b.quando)));
}

function sezParole(dati){
  const { f, locale } = dati;

    const seg = s.testi.flatMap(t => Correttore.analizza(t, { ...opz, escludi:s.escludi }));
    const tenute = (s.e.contenuto.revisione && s.e.contenuto.revisione.tenute) || [];
    const idTenute = new Set(tenute.map(t => t.id));
    return { ...s, aperte:seg.filter(x => x.livello !== 'nota' && !idTenute.has(x.id)), tenute };
  });
  if (!scritti.length) return { html: `

  const link = s => s.tipo === 'episodio' ? `#/f/${esc(f.id)}/episodio/${esc(s.e.id)}` : s.tipo === 'spazio' ? `#/f/${esc(f.id)}/spazio/${esc(s.e.id)}` : `#/f/${esc(f.id)}/cassetta`;
  const quando = s => { try { return new Date(s.quando).toLocaleDateString('it-IT', { day:'numeric', month:'short' }); } catch(e){ return ''; } };
  const prima = righe[0] && Correttore.CATEGORIE[righe[0].cat];
  return { html: `

      <p><b>${plurale(scritti.length, 'scritto letto', 'scritti letti')}</b> (episodi, spazi, voci della cassetta): in <b>${conAperte.length}</b> resta almeno un'espressione da riscrivere o da chiarire.</p>
      ${andamento}
      <p class="nota">Il correttore non coglie tutto: questi numeri sono un punto di partenza per parlarne, non una misura.</p>
    </div>
    ${righe.length ? `

      <h2 style="margin-top:0">Gli sguardi che ritornano</h2>
      <div class="tabella-scorri" tabindex="0" role="region" aria-label="Tabella degli sguardi che ritornano"><table class="tabella-parole">
        <caption class="sr">Tipi di espressione da rivedere negli scritti del team</caption>

      </table></div>
      ${prima ? `<h3>Per parlarne in team</h3>
      <p>Lo sguardo più frequente è <b>${esc(prima.nome.toLowerCase())}</b>. ${esc(prima.perche)}</p>
      <p class="sguardo-domanda">${esc(prima.domanda)}</p>
      <p class="nota">Proposta: al prossimo incontro scegliete un episodio, leggetelo ad alta voce e riscrivetelo insieme con questa domanda. Oppure fate insieme un giro nella <a href="#/sguardo/palestra">palestra dello sguardo</a>.</p>` : ''}

      <h2 style="margin-top:0">Espressioni tenute, con il motivo</h2>
      ${nTenute ? `<ul>${MOTIVI_SGUARDO.filter(([k]) => motivi[k]).map(([k, t]) => `<li><b>${motivi[k]}</b>: ${esc(t)}</li>`).join('')}</ul>
      ${motivi.altro ? '<p class="nota">Le espressioni tenute «per un altro motivo» sono un buon punto di partenza per il prossimo incontro di team.</p>' : ''}` : '<p class="nota" style="margin:0">Nessuna, finora.</p>'}
    </div>
    <div class="foglio">
      <h2 style="margin-top:0">Da rivedere tra i tuoi scritti</h2>
      ${miei.length ? `<ul class="lista-miei">${miei.slice(0, 20).map(s => `<li><a href="${link(s)}">${nomeTipo[s.tipo]} del ${esc(quando(s))}</a>: ${esc(s.aperte.slice(0, 4).map(x => '«' + x.parola + '»').join(', '))}${s.aperte.length > 4 ? '…' : ''}</li>`).join('')}</ul>
      ${miei.length > 20 ? `<p class="nota">E altri ${miei.length - 20}.</p>` : ''}` : '<p class="nota" style="margin:0">Nessuno: nei tuoi scritti il correttore non trova espressioni aperte.</p>'}
      <p class="nota">Aggiungere le parole tipiche del vostro team: <a href="#/sguardo">Le parole del correttore</a>.</p>
    </div>` };
}

/* =========================================================
   8. INSTRADAMENTO E AVVIO
   ========================================================= */
async function router(){
  const parti = (location.hash.replace(/^#\/?/, '') || '').split('/').filter(Boolean);
  if (!S.profilo){ if (parti[0] !== 'benvenuto') { location.hash = '#/benvenuto'; return; } return vistaBenvenuto(); }
  $$('.testata nav a').forEach(a => a.removeAttribute('aria-current'));
  switch (parti[0]){
    case undefined: $('.testata nav a[href="#/"]').setAttribute('aria-current','page'); return vistaHome();
    case 'benvenuto': location.hash = '#/'; return;
    case 'nuovo': return vistaNuovo();
    case 'f':
      if (parti[2] === 'episodio') return vistaEpisodio(parti[1], parti[3]);
      if (parti[2] === 'spazio') return vistaSpazio(parti[1], parti[3]);
      if (parti[2] === 'cassetta' && parti[3] === 'stampa') return vistaStampaCassetta(parti[1]);
      return vistaFascicolo(parti[1], parti[2]);
    case 'sguardo': $('.testata nav a[href="#/sguardo"]').setAttribute('aria-current','page'); return parti[1] === 'palestra' ? vistaPalestra(parti[2]) : vistaSguardo();
    case 'impostazioni': $('.testata nav a[href="#/impostazioni"]').setAttribute('aria-current','page'); return vistaImpostazioni();
    default: location.hash = '#/';
  }
}

const suIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const comeApp = () => navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);

(async function avvio(){
  $('#versione').textContent = APP_VERSIONE;
  /* finestre di dialogo anche dove l'elemento <dialog> non è supportato */
  const dlg = $('#dialogo');
  if (typeof dlg.showModal !== 'function'){
    dlg.classList.add('dialogo-sostituto');
    dlg.showModal = () => dlg.setAttribute('open', '');
    dlg.close = () => dlg.removeAttribute('open');
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && dlg.hasAttribute('open') && dlg.oncancel) dlg.oncancel(e); });
  }
  const ok = await Archivio.apri();
  if (!ok){
    const a = $('#avviso-archivio');
    a.textContent = 'Questo browser non permette di salvare i dati: puoi provare lo strumento, ma quello che scrivi andrà perso alla chiusura. Apri il file con Chrome, Edge, Firefox o Safari aggiornati.';
    a.hidden = false;
  } else {
    try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch(e){}
  }
  S.profilo = await Archivio.leggi('meta', 'profilo') || null;
  S.impostazioni = Object.assign({}, IMPOSTAZIONI_BASE, await Archivio.leggi('meta', 'impostazioni') || {});
  applicaImpostazioni();
  window.addEventListener('hashchange', router);
  router();
})();
</script>
